# Veroeffentlicht die App bei jedem Push auf main als Website (GitHub Pages),
# damit sie auch unterwegs vom Handy erreichbar ist - ohne dass der PC laeuft
# oder man im selben WLAN sein muss.
#
# Dieses Repository enthaelt NUR den Ordner "app" des lokalen Projekts
# (Wurzel hier = app/ dort). Hochgeladen wird es mit
# Online-veroeffentlichen.bat im lokalen Projekt (git subtree) - nie mit
# einem normalen "git push" des ganzen Projekts.
#
# Einmalig im Repository einzustellen (Settings -> Pages):
#   Build and deployment -> Source: "GitHub Actions"
#
# Gebaut wird nur, was im Git liegt. Urheberrechtlich geschuetzte Buchausschnitte
# (bilder-lokal) sind per .gitignore ausgeschlossen und werden zusaetzlich in
# vite.config.js aus dem Build entfernt - sie erreichen den Server nie.
name: App veroeffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur Leserechte fuer alles; Schreibrecht auf Pages und das OIDC-Token
# bekommt allein der Job "veroeffentlichen" - nicht der Job, der npm ci,
# Tests und Fremdpakete ausfuehrt (Sicherheitsaudit 2026-11-04).
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Die fertige App als Ordner samt Start-Skripten (Windows braucht
      # nichts installiert), erreichbar unter <Adresse>/lernprogramm-offline.zip
      - name: Offline-Paket bauen
        run: |
          mkdir paket
          cp -r dist/. paket/
          cp offline/* paket/
          (cd paket && zip -qr ../dist/lernprogramm-offline.zip .)
      - name: Sicherheitspruefung - keine geschuetzten Bilder im Build
        run: |
          if find dist paket -type d -name bilder-lokal | grep -q .; then
            echo "bilder-lokal im Build gefunden - Abbruch"; exit 1
          fi
          if unzip -l dist/lernprogramm-offline.zip | grep -q bilder-lokal; then
            echo "bilder-lokal im Offline-Paket gefunden - Abbruch"; exit 1
          fi
          # Rasterbilder sind Buchausschnitte/Fotos - erlaubt sind nur die App-Icons.
          raster=$(find dist paket -type f | grep -iE '\.(png|jpe?g|webp|gif|bmp|tiff?|avif|pdf)$' | grep -vE '^(dist|paket)/icons/' || true)
          if [ -n "$raster" ]; then
            echo "Rasterbilder ausserhalb von icons/ im Build - Abbruch:"; echo "$raster"; exit 1
          fi
          # SVG mit Script oder Ereignis-Attributen liefe direkt geoeffnet ohne CSP.
          if grep -rliE '<([a-z]+:)?script|<([a-z]+:)?foreignObject|javascript:|<[^>]*[[:space:]]on[a-z]+[[:space:]]*=' --include='*.svg' dist; then
            echo "SVG mit Script im Build - Abbruch"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
