<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 666" width="800" height="666" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="666" fill="#f0ead2"/>
<text x="400" y="38" font-size="22" text-anchor="middle" font-weight="bold" fill="#414833" >Bauen im Außenbereich – § 35 BauGB</text>
<text x="400" y="68" font-size="17" text-anchor="middle" font-weight="normal" fill="#6c584c" >Leitbild: Der Außenbereich bleibt grundsätzlich frei von Bebauung.</text>
<rect x="20" y="88" width="240" height="60" rx="8" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="140" y="115" font-size="20" text-anchor="middle" font-weight="bold" fill="#414833" >privilegiert</text>
<text x="140" y="139" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >Abs. 1</text>
<rect x="20" y="160" width="240" height="226" rx="8" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5"/>
<text x="32" y="188" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >Land- und Forstwirtschaft</text>
<text x="32" y="214" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >Gartenbau</text>
<text x="32" y="240" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >öffentliche Versorgung</text>
<text x="32" y="266" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >ortsgebundene Betriebe</text>
<text x="32" y="292" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >nur im Außenbereich</text>
<text x="32" y="318" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >sinnvoll (z. B. Jagdhütte)</text>
<text x="32" y="344" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >erneuerbare Energien,</text>
<text x="32" y="370" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >Speicher</text>
<rect x="20" y="398" width="240" height="90" rx="8" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="140" y="436" font-size="17" text-anchor="middle" font-weight="bold" fill="#414833" >Belange dürfen nicht</text>
<text x="140" y="462" font-size="17" text-anchor="middle" font-weight="bold" fill="#414833" >entgegenstehen</text>
<text x="140" y="520" font-size="18" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >meist zulässig</text>
<rect x="280" y="88" width="240" height="60" rx="8" fill="#d9d2b4" stroke="#414833" stroke-width="2"/>
<text x="400" y="115" font-size="20" text-anchor="middle" font-weight="bold" fill="#414833" >sonstige</text>
<text x="400" y="139" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >Abs. 2</text>
<rect x="280" y="160" width="240" height="226" rx="8" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5"/>
<text x="292" y="188" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >alle übrigen Vorhaben,</text>
<text x="292" y="214" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >z. B. Einfamilienhaus,</text>
<text x="292" y="240" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >Wochenendhaus,</text>
<text x="292" y="266" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >Tennisplatz</text>
<rect x="280" y="398" width="240" height="90" rx="8" fill="#d9d2b4" stroke="#414833" stroke-width="2"/>
<text x="400" y="436" font-size="17" text-anchor="middle" font-weight="bold" fill="#414833" >Belange dürfen nicht</text>
<text x="400" y="462" font-size="17" text-anchor="middle" font-weight="bold" fill="#414833" >beeinträchtigt werden</text>
<text x="400" y="520" font-size="18" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >meist unzulässig</text>
<rect x="540" y="88" width="240" height="60" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="660" y="115" font-size="20" text-anchor="middle" font-weight="bold" fill="#414833" >teilprivilegiert</text>
<text x="660" y="139" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >Abs. 4</text>
<rect x="540" y="160" width="240" height="226" rx="8" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5"/>
<text x="552" y="188" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >Umnutzung früherer</text>
<text x="552" y="214" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >Hofgebäude</text>
<text x="552" y="240" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >Ersatzbau</text>
<text x="552" y="266" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >Erweiterung Wohnhaus</text>
<text x="552" y="292" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >(höchstens 2 Wohnungen)</text>
<text x="552" y="318" font-size="17" text-anchor="start" font-weight="normal" fill="#414833" >Erweiterung Gewerbe</text>
<rect x="540" y="398" width="240" height="90" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="660" y="424" font-size="17" text-anchor="middle" font-weight="bold" fill="#414833" >FNP, Landschaft und</text>
<text x="660" y="449" font-size="17" text-anchor="middle" font-weight="bold" fill="#414833" >Splittersiedlung</text>
<text x="660" y="474" font-size="17" text-anchor="middle" font-weight="bold" fill="#414833" >entfallen</text>
<text x="660" y="520" font-size="18" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >erleichtert</text>
<line x1="20" y1="542" x2="780" y2="542" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="30" y="570" font-size="18" text-anchor="start" font-weight="normal" fill="#414833" >Für alle: Erschließung gesichert · öffentliche Belange nach Abs. 3</text>
<text x="30" y="597" font-size="18" text-anchor="start" font-weight="normal" fill="#414833" >nachvollziehend abwägen</text>
<text x="30" y="624" font-size="18" text-anchor="start" font-weight="normal" fill="#414833" >Abs. 5: flächensparend, außenbereichsschonend</text>
<text x="30" y="651" font-size="18" text-anchor="start" font-weight="normal" fill="#414833" >Einvernehmen der Gemeinde (§ 36)</text>
</svg>
