<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 750" width="800" height="750" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="750" fill="#f0ead2"/>
<defs><marker id="spitze" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#414833"/></marker></defs>
<text x="400" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#414833" >Planungsrechtliche Zulässigkeit eines Vorhabens</text>
<rect x="230" y="54" width="340" height="50" rx="8" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="400" y="86" font-size="19" text-anchor="middle" font-weight="bold" fill="#414833" >Vorhaben nach § 29 BauGB</text>
<line x1="400" y1="104" x2="400" y2="130" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<rect x="30" y="132" width="440" height="76" rx="8" fill="#d9d2b4" stroke="#414833" stroke-width="2"/>
<text x="250" y="164" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >Gilt ein qualifizierter oder</text>
<text x="250" y="190" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >vorhabenbezogener Bebauungsplan?</text>
<line x1="470" y1="170" x2="518" y2="170" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<text x="480" y="160" font-size="17" text-anchor="start" font-weight="bold" fill="#6c584c" >ja</text>
<rect x="520" y="124" width="250" height="92" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="645" y="150" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >§ 30 Abs. 1 / 2</text>
<text x="645" y="175" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >nicht widersprechen,</text>
<text x="645" y="200" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >Erschließung gesichert</text>
<line x1="250" y1="208" x2="250" y2="248" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<text x="260" y="236" font-size="17" text-anchor="start" font-weight="bold" fill="#6c584c" >nein</text>
<rect x="30" y="250" width="440" height="76" rx="8" fill="#d9d2b4" stroke="#414833" stroke-width="2"/>
<text x="250" y="282" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >Im Zusammenhang bebauter Ortsteil</text>
<text x="250" y="308" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >oder Satzung nach § 34 Abs. 4?</text>
<line x1="470" y1="288" x2="518" y2="288" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<text x="480" y="278" font-size="17" text-anchor="start" font-weight="bold" fill="#6c584c" >ja</text>
<rect x="520" y="242" width="250" height="92" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="645" y="268" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >§ 34 Innenbereich</text>
<text x="645" y="293" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >einfügen,</text>
<text x="645" y="318" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >Erschließung gesichert</text>
<line x1="250" y1="326" x2="250" y2="366" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<text x="260" y="354" font-size="17" text-anchor="start" font-weight="bold" fill="#6c584c" >nein</text>
<rect x="30" y="368" width="740" height="52" rx="8" fill="#a98467" stroke="#414833" stroke-width="2"/>
<text x="400" y="401" font-size="19" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >§ 35 Außenbereich – in allen Fällen: Erschließung gesichert</text>
<line x1="148" y1="420" x2="148" y2="446" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<rect x="30" y="448" width="236" height="128" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="148" y="478" font-size="19" text-anchor="middle" font-weight="bold" fill="#414833" >Abs. 1 privilegiert</text>
<text x="148" y="508" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >öffentliche Belange</text>
<text x="148" y="533" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >dürfen nicht</text>
<text x="148" y="558" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >entgegenstehen</text>
<line x1="400" y1="420" x2="400" y2="446" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<rect x="282" y="448" width="236" height="128" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="400" y="478" font-size="19" text-anchor="middle" font-weight="bold" fill="#414833" >Abs. 2 sonstige</text>
<text x="400" y="508" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >öffentliche Belange</text>
<text x="400" y="533" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >dürfen nicht</text>
<text x="400" y="558" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >beeinträchtigt werden</text>
<line x1="652" y1="420" x2="652" y2="446" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<rect x="534" y="448" width="236" height="128" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="652" y="478" font-size="19" text-anchor="middle" font-weight="bold" fill="#414833" >Abs. 4 teilprivilegiert</text>
<text x="652" y="508" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >bestimmte Belange</text>
<text x="652" y="533" font-size="18" text-anchor="middle" font-weight="normal" fill="#414833" >sind unbeachtlich</text>
<line x1="20" y1="598" x2="780" y2="598" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="30" y="628" font-size="18" text-anchor="start" font-weight="normal" fill="#414833" >Einvernehmen der Gemeinde (§ 36): bei §§ 31, 33, 34 und 35</text>
<text x="30" y="657" font-size="18" text-anchor="start" font-weight="normal" fill="#414833" >Vorgriff während der Planaufstellung: § 33</text>
<text x="30" y="686" font-size="18" text-anchor="start" font-weight="normal" fill="#414833" >Einfacher Bebauungsplan (§ 30 Abs. 3): seine Festsetzungen gehen vor,</text>
<text x="30" y="715" font-size="18" text-anchor="start" font-weight="normal" fill="#414833" >im Übrigen gilt § 34 oder § 35</text>
</svg>
