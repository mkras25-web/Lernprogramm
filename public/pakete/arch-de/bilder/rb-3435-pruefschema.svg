<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="620" fill="#f0ead2"/>
<defs><marker id="spitze" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#414833"/></marker></defs>
<text x="400" y="34" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833" >Planungsrechtliche Zulässigkeit eines Vorhabens</text>
<rect x="250" y="52" width="300" height="44" rx="8" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="400" y="80" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >Vorhaben nach § 29 BauGB</text>
<line x1="400" y1="96" x2="400" y2="122" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<rect x="40" y="124" width="420" height="62" rx="8" fill="#d9d2b4" stroke="#414833" stroke-width="2"/>
<text x="250" y="150" font-size="15" text-anchor="middle" font-weight="normal" fill="#414833" >Gilt ein qualifizierter oder</text>
<text x="250" y="170" font-size="15" text-anchor="middle" font-weight="normal" fill="#414833" >vorhabenbezogener Bebauungsplan?</text>
<line x1="460" y1="155" x2="508" y2="155" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/><text x="468" y="146" font-size="14" text-anchor="start" font-weight="bold" fill="#6c584c" >ja</text>
<rect x="510" y="118" width="260" height="74" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="640" y="142" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >§ 30 Abs. 1 / 2</text>
<text x="640" y="160" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >nicht widersprechen,</text>
<text x="640" y="178" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >Erschließung gesichert</text>
<line x1="250" y1="186" x2="250" y2="226" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/><text x="258" y="212" font-size="14" text-anchor="start" font-weight="bold" fill="#6c584c" >nein</text>
<rect x="40" y="228" width="420" height="62" rx="8" fill="#d9d2b4" stroke="#414833" stroke-width="2"/>
<text x="250" y="254" font-size="15" text-anchor="middle" font-weight="normal" fill="#414833" >Im Zusammenhang bebauter Ortsteil</text>
<text x="250" y="274" font-size="15" text-anchor="middle" font-weight="normal" fill="#414833" >oder Satzung nach § 34 Abs. 4?</text>
<line x1="460" y1="259" x2="508" y2="259" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/><text x="468" y="250" font-size="14" text-anchor="start" font-weight="bold" fill="#6c584c" >ja</text>
<rect x="510" y="222" width="260" height="74" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="640" y="246" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >§ 34 Innenbereich</text>
<text x="640" y="264" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >einfügen,</text>
<text x="640" y="282" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >Erschließung gesichert</text>
<line x1="250" y1="290" x2="250" y2="330" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/><text x="258" y="316" font-size="14" text-anchor="start" font-weight="bold" fill="#6c584c" >nein</text>
<rect x="40" y="332" width="730" height="44" rx="8" fill="#a98467" stroke="#414833" stroke-width="2"/>
<text x="405" y="360" font-size="16" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >§ 35 Außenbereich – in allen Fällen: Erschließung gesichert</text>
<line x1="155" y1="376" x2="155" y2="400" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<rect x="40" y="402" width="230" height="86" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="155" y="426" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >Abs. 1 privilegiert</text>
<text x="155" y="450" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >öffentliche Belange</text>
<text x="155" y="468" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >dürfen nicht entgegenstehen</text>
<line x1="405" y1="376" x2="405" y2="400" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<rect x="290" y="402" width="230" height="86" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="405" y="426" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >Abs. 2 sonstige</text>
<text x="405" y="450" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >öffentliche Belange dürfen</text>
<text x="405" y="468" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >nicht beeinträchtigt werden</text>
<line x1="655" y1="376" x2="655" y2="400" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<rect x="540" y="402" width="230" height="86" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="655" y="426" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >Abs. 4 teilprivilegiert</text>
<text x="655" y="450" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >bestimmte Belange</text>
<text x="655" y="468" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >sind unbeachtlich</text>
<line x1="20" y1="512" x2="780" y2="512" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="40" y="540" font-size="15" text-anchor="start" font-weight="normal" fill="#414833" >Einvernehmen der Gemeinde (§ 36): bei §§ 31, 33, 34 und 35</text>
<text x="40" y="566" font-size="15" text-anchor="start" font-weight="normal" fill="#414833" >Vorgriff während der Planaufstellung: § 33</text>
<text x="40" y="592" font-size="15" text-anchor="start" font-weight="normal" fill="#414833" >Einfacher Bebauungsplan: § 30 Abs. 3 – seine Festsetzungen gehen vor</text>
</svg>
