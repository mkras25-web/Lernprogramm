<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
<defs>
<pattern id="mw" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="14" height="14" fill="#a98467"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#6c584c" stroke-width="1.1" opacity="0.55"/>
</pattern>
<pattern id="dm" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#adc178"/>
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f7f3e4" stroke-width="2" opacity="0.7"/>
</pattern>
<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#dde5b6"/>
  <line x1="0" y1="0" x2="9" y2="9" stroke="#6c584c" stroke-width="0.9" opacity="0.5"/>
</pattern>
<pattern id="pu" width="8" height="8" patternUnits="userSpaceOnUse">
  <rect width="8" height="8" fill="#f7f3e4"/>
  <circle cx="4" cy="4" r="1.6" fill="#adc178"/>
</pattern>
</defs>
<rect x="0" y="0" width="900" height="470" fill="#f0ead2"/>
<text x="450.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Die drei Anschlagsarten</text>
<text x="450.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Horizontalschnitt — Geometrie der Wandöffnung, nicht die Tiefenlage des Fensters</text>
<polygon points="40,100 150,100 150,240 40,240" fill="url(#mw)" stroke="#414833" stroke-width="1.8"/>
<rect x="150" y="148" width="76" height="55" fill="url(#hz)" stroke="#414833" stroke-width="1.8"/>
<line x1="226" y1="172.5" x2="286" y2="172.5" stroke="#6c584c" stroke-width="2.2"/>
<line x1="226" y1="178.5" x2="286" y2="178.5" stroke="#6c584c" stroke-width="2.2"/>
<line x1="150" y1="100" x2="150" y2="240" stroke="#9a6b1f" stroke-width="3.5"/>
<text x="40" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">außen</text>
<text x="40" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">innen</text>
<text x="40" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">a  stumpfer Anschlag</text>
<text x="40" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Tiefenposition durch die</text>
<text x="40" y="331" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Öffnung nicht vorgegeben;</text>
<text x="40" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Einbau von innen oder außen.</text>
<text x="40" y="369" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Abstand Rahmenaußenkante</text>
<text x="40" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">zur Wandöffnung i. d. R. 4–6 cm.</text>
<polygon points="332,100 486,100 486,146 442,146 442,240 332,240" fill="url(#mw)" stroke="#414833" stroke-width="1.8"/>
<rect x="442" y="146" width="76" height="55" fill="url(#hz)" stroke="#414833" stroke-width="1.8"/>
<line x1="518" y1="170.5" x2="578" y2="170.5" stroke="#6c584c" stroke-width="2.2"/>
<line x1="518" y1="176.5" x2="578" y2="176.5" stroke="#6c584c" stroke-width="2.2"/>
<line x1="442" y1="146" x2="486" y2="146" stroke="#9a6b1f" stroke-width="3.5"/>
<text x="332" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">außen</text>
<text x="332" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">innen</text>
<text x="332" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">b  Innenanschlag</text>
<text x="332" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Das Element liegt innen gegen</text>
<text x="332" y="331" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">einen außenliegenden</text>
<text x="332" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Laibungsvorsprung.</text>
<text x="332" y="369" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Der Einbau erfolgt von innen.</text>
<polygon points="624,100 734,100 734,194 778,194 778,240 624,240" fill="url(#mw)" stroke="#414833" stroke-width="1.8"/>
<rect x="734" y="139" width="76" height="55" fill="url(#hz)" stroke="#414833" stroke-width="1.8"/>
<line x1="810" y1="163.5" x2="870" y2="163.5" stroke="#6c584c" stroke-width="2.2"/>
<line x1="810" y1="169.5" x2="870" y2="169.5" stroke="#6c584c" stroke-width="2.2"/>
<line x1="734" y1="194" x2="778" y2="194" stroke="#9a6b1f" stroke-width="3.5"/>
<text x="624" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">außen</text>
<text x="624" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">innen</text>
<text x="624" y="288" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">c  Außenanschlag</text>
<text x="624" y="312" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Das Element liegt außen gegen</text>
<text x="624" y="331" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">einen innenliegenden</text>
<text x="624" y="350" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Laibungsvorsprung.</text>
<text x="624" y="369" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Einbau von außen, häufig mit</text>
<text x="624" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Gerüst; voll der Witterung ausgesetzt.</text>
<line x1="30" y1="408" x2="870" y2="408" stroke="#d9d2b4" stroke-width="1.5"/>
<line x1="36" y1="428" x2="60" y2="428" stroke="#9a6b1f" stroke-width="3.5"/>
<text x="70" y="433" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Fläche, gegen die das Element angeschlagen wird. Innen- und Außenanschlag bieten mehr Fugenfläche für Dicht- und Dämmstoffe,</text>
<text x="70" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">verändern aber die Innen- und Außenansicht. Nach DETAIL Atlas Gebäudeöffnungen, gedr. S. 124.</text>
</svg>