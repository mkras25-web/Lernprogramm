<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
<defs>
<pattern id="mw" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="14" height="14" fill="#a98467"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#6c584c" stroke-width="1.1" opacity="0.55"/>
</pattern>
<pattern id="dm" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#adc178"/>
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f7f3e4" stroke-width="2" opacity="0.7"/>
</pattern>
<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#dde5b6"/>
  <line x1="0" y1="0" x2="9" y2="9" stroke="#6c584c" stroke-width="0.9" opacity="0.5"/>
</pattern>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a6b1f"/></marker>
<marker id="pfk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6c584c"/></marker>
</defs>
<rect x="0" y="0" width="900" height="500" fill="#f0ead2"/>
<text x="450.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Der Weg zum erforderlichen Schalldämmmaß</text>
<text x="450.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Verfahren nach DIN 4109 — raumweise, von außen nach innen</text>
<rect x="60" y="92" width="780" height="72" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="1.8"/>
<circle cx="104" cy="128" r="19" fill="#adc178" stroke="#414833" stroke-width="1.8"/>
<text x="104" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">1</text>
<text x="142" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">Lärmpegelbereich bestimmen</text>
<text x="142" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Sieben Bereiche I bis VII nach dem maßgeblichen Außenlärmpegel</text>
<line x1="450" y1="164" x2="450" y2="180" stroke="#414833" stroke-width="2.4" marker-end="url(#pfk)"/>
<rect x="60" y="180" width="780" height="72" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="1.8"/>
<circle cx="104" cy="216" r="19" fill="#adc178" stroke="#414833" stroke-width="1.8"/>
<text x="104" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">2</text>
<text x="142" y="211" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">erf. R'w,res ablesen</text>
<text x="142" y="234" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">aus Lärmpegelbereich und Raumart — Bettenraum, Aufenthaltsraum, Büro</text>
<line x1="450" y1="252" x2="450" y2="268" stroke="#414833" stroke-width="2.4" marker-end="url(#pfk)"/>
<rect x="60" y="268" width="780" height="72" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="1.8"/>
<circle cx="104" cy="304" r="19" fill="#adc178" stroke="#414833" stroke-width="1.8"/>
<text x="104" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">3</text>
<text x="142" y="299" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">Korrektur anbringen</text>
<text x="142" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">nach dem Verhältnis S(W+F) zu SG, von +5 bis −3 dB</text>
<line x1="450" y1="340" x2="450" y2="356" stroke="#414833" stroke-width="2.4" marker-end="url(#pfk)"/>
<rect x="60" y="356" width="780" height="72" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="1.8"/>
<circle cx="104" cy="392" r="19" fill="#adc178" stroke="#414833" stroke-width="1.8"/>
<text x="104" y="398" font-family="Segoe UI, Arial, sans-serif" font-size="17" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">4</text>
<text x="142" y="387" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">auf die Einzelbauteile aufteilen</text>
<text x="142" y="410" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Wand und Fenster nach ihren Flächenanteilen, Einbauten eingeschlossen</text>
<text x="60" y="462" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a6b1f" font-weight="normal" font-style="italic">Die Anforderung gilt dem gesamten Außenbauteil im eingebauten Zustand — Außenwand, Fenster,</text>
<text x="60" y="482" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a6b1f" font-weight="normal" font-style="italic">Rollladenkästen, Lüftungseinrichtungen und die Bauanschlüsse zusammen.</text>
</svg>