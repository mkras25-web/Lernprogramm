  <rect width="14" height="14" fill="#a98467"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#6c584c" stroke-width="1.1" opacity="0.55"/>
</pattern>
<pattern id="dm" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#adc178"/>
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f7f3e4" stroke-width="2" opacity="0.7"/>
</pattern>
<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#dde5b6"/>
  <line x1="0" y1="0" x2="9" y2="9" stroke="#6c584c" stroke-width="0.9" opacity="0.5"/>
</pattern>
<pattern id="bt" width="12" height="12" patternUnits="userSpaceOnUse">
  <rect width="12" height="12" fill="#d9d2b4"/>
  <circle cx="3" cy="4" r="1.4" fill="#6c584c" opacity="0.5"/>
  <circle cx="9" cy="9" r="1.1" fill="#6c584c" opacity="0.5"/>
</pattern>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a6b1f"/></marker>
<marker id="pfk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6c584c"/></marker>
</defs>
<rect x="0" y="0" width="920" height="500" fill="#f0ead2"/>
<text x="460.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Die Öffnung als Tragproblem</text>
<text x="460.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Vier Wege, eine Öffnung in ein Flächenbauteil zu bringen — Prinzipskizzen, Ansicht</text>
<path d="M44,90 L220,90 L220,290 L44,290 Z M98,180 L166,180 L166,290 L98,290 Z" fill-rule="evenodd" fill="url(#mw)" stroke="#414833" stroke-width="1.8"/>
<text x="132.0" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Öffnung</text>
<path d="M78,180 A54,54 0 0 1 186,180" fill="none" stroke="#9a6b1f" stroke-width="4"/>
<line x1="64" y1="104" x2="64" y2="142" stroke="#9a6b1f" stroke-width="2.2" marker-end="url(#pf)"/>
<line x1="200" y1="104" x2="200" y2="142" stroke="#9a6b1f" stroke-width="2.2" marker-end="url(#pf)"/>
<text x="44" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">a  Entlastungsbogen</text>
<text x="44" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Die Last wird um die Öffnung</text>
<text x="44" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">herumgeführt.</text>
<path d="M270,90 L446,90 L446,290 L270,290 Z M324,180 L392,180 L392,290 L324,290 Z" fill-rule="evenodd" fill="url(#mw)" stroke="#414833" stroke-width="1.8"/>
<text x="358.0" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Öffnung</text>
<rect x="302" y="158" width="112" height="22" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<line x1="358.0" y1="112" x2="358.0" y2="150" stroke="#9a6b1f" stroke-width="2.2" marker-end="url(#pf)"/>
<text x="270" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">b  Sturz</text>
<text x="270" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Ein biegesteifes Bauteil</text>
<text x="270" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">überspannt die Öffnung.</text>
<path d="M496,90 L672,90 L672,290 L496,290 Z M550,180 L618,180 L618,290 L550,290 Z" fill-rule="evenodd" fill="url(#bt)" stroke="#414833" stroke-width="1.8"/>
<text x="584.0" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Öffnung</text>
<line x1="536" y1="154" x2="536" y2="282" stroke="#9a6b1f" stroke-width="3"/>
<line x1="632" y1="154" x2="632" y2="282" stroke="#9a6b1f" stroke-width="3"/>
<line x1="530" y1="164" x2="638" y2="164" stroke="#9a6b1f" stroke-width="3"/>
<text x="496" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">c  angepasste Bewehrung</text>
<text x="496" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">In der Betonwand erfordern</text>
<text x="496" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">die erhöhten Spannungen</text>
<text x="496" y="374" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">mehr Bewehrung.</text>
<rect x="722" y="90" width="176" height="200" fill="#f7f3e4" stroke="#414833" stroke-width="1.6"/>
<rect x="740" y="108" width="61" height="64" fill="url(#mw)" stroke="#414833" stroke-width="1.2"/>
<rect x="819" y="108" width="61" height="64" fill="url(#mw)" stroke="#414833" stroke-width="1.2"/>
<rect x="819" y="190" width="61" height="82" fill="url(#mw)" stroke="#414833" stroke-width="1.2"/>
<rect x="722" y="90" width="176" height="18" fill="url(#hz)" stroke="#414833" stroke-width="1.6"/>
<rect x="722" y="172" width="176" height="18" fill="url(#hz)" stroke="#414833" stroke-width="1.6"/>
<rect x="722" y="272" width="176" height="18" fill="url(#hz)" stroke="#414833" stroke-width="1.6"/>
<rect x="722" y="90" width="18" height="200" fill="url(#hz)" stroke="#414833" stroke-width="1.6"/>
<rect x="801" y="90" width="18" height="200" fill="url(#hz)" stroke="#414833" stroke-width="1.6"/>
<rect x="880" y="90" width="18" height="200" fill="url(#hz)" stroke="#414833" stroke-width="1.6"/>
<text x="770" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Öffnung</text>
<text x="722" y="318" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">d  Weglassen</text>
<text x="722" y="340" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Die Öffnung entsteht, indem</text>
<text x="722" y="357" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">ein Feld nicht ausgefacht wird.</text>
<line x1="30" y1="404" x2="890" y2="404" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="30" y="430" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Die Standsicherheit der Außenwand darf nicht gefährdet werden, zugleich müssen die Lasten aus dem Öffnungsbauteil sicher in den</text>
<text x="30" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Baukörper eingeleitet werden. Weitere Mittel: Auswechslungen von Balken und andere Verstärkungen.</text>
<text x="30" y="478" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a6b1f" font-weight="normal" font-style="italic">Vergleichsweise einfach sind Öffnungen, die durch Weglassen entstehen — Fall d.</text>
</svg>