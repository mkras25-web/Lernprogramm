<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="mwE" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#a98467"/>
      <line x1="0" y1="11" x2="22" y2="11" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
      <line x1="11" y1="0" x2="11" y2="11" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
      <line x1="0" y1="11" x2="0" y2="22" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="820" height="580" fill="#f0ead2"/>

  <path d="M80,80 L160,80 L160,380 L700,380 L700,460 L80,460 Z" fill="url(#mwE)" stroke="#414833" stroke-width="1.8"/>

  <g fill="none" stroke="#6c584c" stroke-width="1.8" stroke-dasharray="7 5">
    <path d="M140,80 L140,380 A20,20 0 0 0 160,400 L700,400"/>
    <path d="M120,80 L120,380 A40,40 0 0 0 160,420 L700,420"/>
    <path d="M100,80 L100,380 A60,60 0 0 0 160,440 L700,440"/>
  </g>

  <!-- Flaechenvergleich -->
  <g stroke="#9a6b1f" stroke-width="3" fill="none">
    <path d="M68,80 L68,472 L700,472"/>
    <path d="M172,80 L172,368 L700,368"/>
  </g>
  <g font-size="13" fill="#9a6b1f">
    <text x="698" y="496" text-anchor="end">wärmeabgebende Außenfläche: groß</text>
    <text x="698" y="358" text-anchor="end">wärmeaufnehmende Innenfläche: klein</text>
  </g>

  <g font-size="17" font-weight="600" fill="#414833">
    <text x="600" y="130">innen +20 °C</text>
    <text x="100" y="545">außen −5 °C</text>
  </g>

  <g font-size="14" fill="#414833">
    <text x="262" y="292">Innenecke: niedrigste</text>
    <text x="262" y="311">Oberflächentemperatur</text>
    <line x1="258" y1="300" x2="170" y2="372" stroke="#414833" stroke-width="1.2"/>
    <text x="250" y="110" fill="#6c584c">Isothermen</text>
    <line x1="246" y1="104" x2="146" y2="124" stroke="#6c584c" stroke-width="1.2"/>
    <text x="196" y="534" fill="#6c584c">ungestörter Wandbereich – hier gilt der U-Wert</text>
    <line x1="250" y1="524" x2="250" y2="478" stroke="#6c584c" stroke-width="1.2"/>
  </g>
</svg>
