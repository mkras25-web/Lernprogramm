<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470">
<defs>
<pattern id="mw" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="14" height="14" fill="#a98467"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#6c584c" stroke-width="1.1" opacity="0.55"/>
</pattern>
<pattern id="dm" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#adc178"/>
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f7f3e4" stroke-width="2" opacity="0.7"/>
</pattern>
<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#dde5b6"/>
  <line x1="0" y1="0" x2="9" y2="9" stroke="#6c584c" stroke-width="0.9" opacity="0.5"/>
</pattern>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a6b1f"/></marker>
<marker id="pfk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6c584c"/></marker>
</defs>
<rect x="0" y="0" width="900" height="470" fill="#f0ead2"/>
<text x="450.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Zwei Wege zur Schalldämmung</text>
<text x="450.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Masse allein oder Masse-Feder-Masse — Horizontalschnitt</text>
<text x="230" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">einschalig: Masse</text>
<path d="M50,170 q13,-7 26,0 q13,7 26,0 q13,-7 26,0" fill="none" stroke="#9a6b1f" stroke-width="2.6" marker-end="url(#pf)"/>
<rect x="162" y="118" width="86" height="104" fill="url(#mw)" stroke="#414833" stroke-width="2"/>
<text x="205" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">eine schwere Schale</text>
<path d="M262,170 q13,-4 26,0 q13,4 26,0" fill="none" stroke="#6c584c" stroke-width="1.8" marker-end="url(#pfk)"/>
<text x="50" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Das Bauteil ist möglichst schwer und damit träge:</text>
<text x="50" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">hohe Dichte, ausreichende Dicke. Luftschallwellen</text>
<text x="50" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">regen es nur in geringem Maße zum Schwingen an.</text>
<text x="670" y="96" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">zweischalig: Masse-Feder-Masse</text>
<path d="M490,170 q13,-7 26,0 q13,7 26,0 q13,-7 26,0" fill="none" stroke="#9a6b1f" stroke-width="2.6" marker-end="url(#pf)"/>
<rect x="588" y="118" width="44" height="104" fill="url(#mw)" stroke="#414833" stroke-width="2"/>
<rect x="632" y="118" width="60" height="104" fill="url(#dm)" stroke="#414833" stroke-width="1.6"/>
<rect x="692" y="118" width="60" height="104" fill="url(#mw)" stroke="#414833" stroke-width="2"/>
<text x="610" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Schale 1</text>
<text x="662" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Feder</text>
<text x="722" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Schale 2</text>
<path d="M762,170 q13,-2.5 26,0 q13,2.5 26,0" fill="none" stroke="#6c584c" stroke-width="1.5" marker-end="url(#pfk)"/>
<line x1="632" y1="138" x2="692" y2="138" stroke="#9a6b1f" stroke-width="2.4" stroke-dasharray="5 5"/>
<circle cx="662" cy="138" r="11" fill="none" stroke="#9a6b1f" stroke-width="2.4"/>
<line x1="655" y1="131" x2="669" y2="145" stroke="#9a6b1f" stroke-width="2.4"/>
<text x="662" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#9a6b1f" font-weight="bold" font-style="normal">keine starre Verbindung</text>
<text x="490" y="274" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Zwei Schalen ohne starre Verbindungsmittel, dazwischen</text>
<text x="490" y="292" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">ein gedämmter Zwischenraum. Besonders wirksam, wenn</text>
<text x="490" y="310" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">beide Schalen unterschiedliche Masse und verschiedene</text>
<text x="490" y="328" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Koinzidenzgrenzfrequenzen haben.</text>
<line x1="40" y1="366" x2="860" y2="366" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="40" y="392" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Der Preis des zweischaligen Systems ist seine Systemeigenfrequenz: Bei ihr verschlechtert sich die Schalldämmung zunächst.</text>
<text x="40" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Sie sollte deshalb möglichst tief liegen.</text>
<text x="40" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a6b1f" font-weight="normal" font-style="italic">Dritte Maßnahme neben beiden: eine möglichst effektive Abdichtung aller Fugen, Spalten und Ritzen.</text>
</svg>