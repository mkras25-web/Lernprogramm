<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480" role="img" aria-label="Sockelanschluss einer zweischaligen Außenwand, ohne Beschriftung" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="erdreich" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#aab0ab" stroke-width="1"/>
    </pattern>
    <pattern id="daemmung" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#aab0ab"/>
    </pattern>
    <pattern id="beton" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#c3c8c4" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="360" height="480" fill="#ffffff"/>

  <!-- Erdreich -->
  <rect x="0" y="210" width="118" height="270" fill="url(#erdreich)"/>
  <rect x="0" y="430" width="360" height="50" fill="url(#erdreich)"/>

  <!-- Geländeoberkante -->
  <line x1="0" y1="210" x2="118" y2="210" stroke="#1b2430" stroke-width="1.2"/>
  <line x1="118" y1="210" x2="150" y2="210" stroke="#1b2430" stroke-width="0.8" stroke-dasharray="4 3"/>

  <!-- Tragende Innenschale / Kellerwand -->
  <rect x="150" y="40" width="80" height="390" fill="url(#beton)" stroke="#1b2430" stroke-width="1.2"/>

  <!-- Kerndämmung oberhalb GOK -->
  <rect x="118" y="40" width="32" height="170" fill="url(#daemmung)" stroke="#1b2430" stroke-width="0.8"/>

  <!-- Außenschale / Verblendmauerwerk -->
  <rect x="78" y="40" width="40" height="170" fill="#ffffff" stroke="#1b2430" stroke-width="1.2"/>
  <g stroke="#c3c8c4" stroke-width="0.8">
    <line x1="78" y1="70" x2="118" y2="70"/>
    <line x1="78" y1="100" x2="118" y2="100"/>
    <line x1="78" y1="130" x2="118" y2="130"/>
    <line x1="78" y1="160" x2="118" y2="160"/>
    <line x1="78" y1="190" x2="118" y2="190"/>
  </g>

  <!-- Perimeterdämmung unterhalb GOK -->
  <rect x="118" y="210" width="32" height="220" fill="url(#daemmung)" stroke="#1b2430" stroke-width="0.8"/>

  <!-- Vertikale Abdichtung auf der Wandaußenseite, mit Hohlkehle -->
  <path d="M150 170 L150 410 Q150 430 170 430" fill="none" stroke="#2f5d50" stroke-width="2.6"/>

  <!-- Sockelabdichtung über GOK -->
  <line x1="150" y1="170" x2="150" y2="210" stroke="#9a6b1f" stroke-width="3"/>

  <!-- Querschnittsabdichtung unter der Innenschale -->
  <line x1="150" y1="418" x2="230" y2="418" stroke="#2f5d50" stroke-width="2.6"/>

  <!-- Bodenplatte -->
  <rect x="150" y="430" width="180" height="34" fill="url(#beton)" stroke="#1b2430" stroke-width="1.2"/>

  <!-- Entwässerungsöffnung am Fuß der Außenschale -->
  <rect x="78" y="196" width="40" height="8" fill="#ffffff" stroke="#9a6b1f" stroke-width="1.4"/>

  <g font-family="Georgia, serif" font-size="11" fill="#77807c">
    <text x="12" y="228">außen</text>
    <text x="300" y="60">innen</text>
    <text x="158" y="204">GOK</text>
  </g>
</svg>
