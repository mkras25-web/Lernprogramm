<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 606" width="800" height="606" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="606" fill="#f0ead2"/>
<text x="400" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#414833">Bauvorlagen für einen Bauantrag in Hessen</text>
<path d="M 30 58 L 244 58 L 266 80 L 266 174 L 30 174 Z" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<path d="M 244 58 L 244 80 L 266 80" fill="#d9d2b4" stroke="#414833" stroke-width="1.5"/>
<text x="44" y="90" font-size="19" text-anchor="start" font-weight="bold" fill="#414833">Bauantrag</text>
<text x="44" y="116" font-size="17" text-anchor="start" fill="#6c584c">Formular BAB 01</text>
<text x="44" y="138" font-size="17" text-anchor="start" fill="#6c584c">oder Bauportal Hessen</text>
<path d="M 282 58 L 496 58 L 518 80 L 518 174 L 282 174 Z" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<path d="M 496 58 L 496 80 L 518 80" fill="#d9d2b4" stroke="#414833" stroke-width="1.5"/>
<text x="296" y="90" font-size="19" text-anchor="start" font-weight="bold" fill="#414833">Übersichtsplan</text>
<text x="296" y="116" font-size="17" text-anchor="start" fill="#6c584c">1 : 10.000 bis 1 : 25.000</text>
<text x="296" y="138" font-size="17" text-anchor="start" fill="#6c584c">Grundstück markiert</text>
<path d="M 534 58 L 748 58 L 770 80 L 770 174 L 534 174 Z" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<path d="M 748 58 L 748 80 L 770 80" fill="#d9d2b4" stroke="#414833" stroke-width="1.5"/>
<text x="548" y="90" font-size="19" text-anchor="start" font-weight="bold" fill="#414833">Liegenschaftsplan</text>
<text x="548" y="116" font-size="17" text-anchor="start" fill="#6c584c">Auszug aus der</text>
<text x="548" y="138" font-size="17" text-anchor="start" fill="#6c584c">Liegenschaftskarte,</text>
<text x="548" y="160" font-size="17" text-anchor="start" fill="#6c584c">≤ 2 Jahre, meist 1 : 500</text>
<path d="M 30 186 L 244 186 L 266 208 L 266 302 L 30 302 Z" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<path d="M 244 186 L 244 208 L 266 208" fill="#d9d2b4" stroke="#414833" stroke-width="1.5"/>
<text x="44" y="218" font-size="19" text-anchor="start" font-weight="bold" fill="#414833">Bauzeichnungen</text>
<text x="44" y="244" font-size="17" text-anchor="start" fill="#6c584c">meist 1 : 100:</text>
<text x="44" y="266" font-size="17" text-anchor="start" fill="#6c584c">Grundrisse, Schnitte,</text>
<text x="44" y="288" font-size="17" text-anchor="start" fill="#6c584c">Ansichten</text>
<path d="M 282 186 L 496 186 L 518 208 L 518 302 L 282 302 Z" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<path d="M 496 186 L 496 208 L 518 208" fill="#d9d2b4" stroke="#414833" stroke-width="1.5"/>
<text x="296" y="218" font-size="19" text-anchor="start" font-weight="bold" fill="#414833">Freiflächenplan</text>
<text x="296" y="244" font-size="17" text-anchor="start" fill="#6c584c">Spielplätze, Stellplätze,</text>
<text x="296" y="266" font-size="17" text-anchor="start" fill="#6c584c">Feuerwehrflächen,</text>
<text x="296" y="288" font-size="17" text-anchor="start" fill="#6c584c">Begrünung</text>
<path d="M 534 186 L 748 186 L 770 208 L 770 302 L 534 302 Z" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<path d="M 748 186 L 748 208 L 770 208" fill="#d9d2b4" stroke="#414833" stroke-width="1.5"/>
<text x="548" y="218" font-size="19" text-anchor="start" font-weight="bold" fill="#414833">Baubeschreibung</text>
<text x="548" y="244" font-size="17" text-anchor="start" fill="#6c584c">formlos: was die</text>
<text x="548" y="266" font-size="17" text-anchor="start" fill="#6c584c">Zeichnungen nicht</text>
<text x="548" y="288" font-size="17" text-anchor="start" fill="#6c584c">zeigen</text>
<path d="M 30 314 L 244 314 L 266 336 L 266 430 L 30 430 Z" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<path d="M 244 314 L 244 336 L 266 336" fill="#d9d2b4" stroke="#414833" stroke-width="1.5"/>
<text x="44" y="346" font-size="19" text-anchor="start" font-weight="bold" fill="#414833">Berechnungen</text>
<text x="44" y="372" font-size="17" text-anchor="start" fill="#6c584c">GRZ, GFZ nachvollziehbar,</text>
<text x="44" y="394" font-size="17" text-anchor="start" fill="#6c584c">umbauter Raum,</text>
<text x="44" y="416" font-size="17" text-anchor="start" fill="#6c584c">Flächen</text>
<path d="M 282 314 L 496 314 L 518 336 L 518 430 L 282 430 Z" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<path d="M 496 314 L 496 336 L 518 336" fill="#d9d2b4" stroke="#414833" stroke-width="1.5"/>
<text x="296" y="346" font-size="19" text-anchor="start" font-weight="bold" fill="#414833">Abstandsflächen</text>
<text x="296" y="372" font-size="17" text-anchor="start" fill="#6c584c">Nachweis, meist in</text>
<text x="296" y="394" font-size="17" text-anchor="start" fill="#6c584c">den Bauzeichnungen</text>
<path d="M 534 314 L 748 314 L 770 336 L 770 430 L 534 430 Z" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<path d="M 748 314 L 748 336 L 770 336" fill="#d9d2b4" stroke="#414833" stroke-width="1.5"/>
<text x="548" y="346" font-size="19" text-anchor="start" font-weight="bold" fill="#414833">Berechtigung</text>
<text x="548" y="372" font-size="17" text-anchor="start" fill="#6c584c">Nachweis der</text>
<text x="548" y="394" font-size="17" text-anchor="start" fill="#6c584c">Bauvorlageberechtigung</text>
<rect x="30" y="450" width="740" height="100" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="48" y="480" font-size="19" text-anchor="start" font-weight="bold" fill="#414833">Vor Baubeginn bzw. vor dem jeweiligen Bauabschnitt:</text>
<text x="48" y="507" font-size="17" text-anchor="start" fill="#414833">Baubeginnsanzeige · Standsicherheitsnachweis ·</text>
<text x="48" y="531" font-size="17" text-anchor="start" fill="#414833">Brandschutznachweis · Wärme- und Schallschutznachweis</text>
<text x="400" y="584" font-size="16" text-anchor="middle" fill="#6c584c">Welche Vorlagen im Einzelfall nötig sind, regelt der Bauvorlagenerlass je Verfahren.</text>
</svg>
