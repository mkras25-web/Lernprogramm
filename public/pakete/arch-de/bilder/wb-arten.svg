<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="mwA" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#a98467"/>
      <line x1="0" y1="10" x2="20" y2="10" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
      <line x1="10" y1="0" x2="10" y2="10" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
      <line x1="0" y1="10" x2="0" y2="20" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
    </pattern>
    <pattern id="btA" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#6c584c"/>
      <circle cx="3" cy="4" r="1.2" fill="#f0ead2" opacity="0.7"/>
      <circle cx="9" cy="9" r="1" fill="#f0ead2" opacity="0.7"/>
    </pattern>
    <pattern id="dmA" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#adc178"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="980" height="390" fill="#f0ead2"/>

  <!-- 1 formbedingt -->
  <text x="40" y="52" font-size="17" font-weight="600" fill="#414833">formbedingt</text>
  <path d="M60,90 L110,90 L110,230 L300,230 L300,280 L60,280 Z" fill="url(#mwA)" stroke="#414833" stroke-width="1.6"/>
  <g fill="none" stroke="#6c584c" stroke-width="1.5" stroke-dasharray="6 4">
    <path d="M95,90 L95,230 A15,15 0 0 0 110,245 L300,245"/>
    <path d="M80,90 L80,230 A30,30 0 0 0 110,260 L300,260"/>
  </g>
  <text x="180" y="150" font-size="13" fill="#6c584c">innen</text>
  <text x="80" y="310" font-size="13" fill="#6c584c">außen</text>
  <text x="40" y="344" font-size="13" fill="#414833">Außenecke: der Wärmestrom weitet sich auf,</text>
  <text x="40" y="364" font-size="13" fill="#414833">die Innenecke kühlt aus.</text>

  <!-- 2 stoffbedingt -->
  <text x="370" y="52" font-size="17" font-weight="600" fill="#414833">stoffbedingt</text>
  <rect x="370" y="90" width="240" height="190" fill="url(#mwA)" stroke="#414833" stroke-width="1.6"/>
  <rect x="465" y="90" width="50" height="190" fill="url(#btA)" stroke="#414833" stroke-width="1.6"/>
  <text x="370" y="344" font-size="13" fill="#414833">Stahlbetonstütze im Mauerwerk: gleiche Dicke,</text>
  <text x="370" y="364" font-size="13" fill="#414833">aber deutlich höhere Wärmeleitfähigkeit.</text>

  <!-- 3 konstruktiv -->
  <text x="690" y="52" font-size="17" font-weight="600" fill="#414833">konstruktiv</text>
  <rect x="790" y="90" width="60" height="190" fill="url(#mwA)" stroke="#414833" stroke-width="1.6"/>
  <rect x="850" y="90" width="30" height="190" fill="url(#dmA)" stroke="#414833" stroke-width="1.6"/>
  <rect x="690" y="160" width="250" height="34" fill="url(#btA)" stroke="#414833" stroke-width="1.6"/>
  <text x="700" y="130" font-size="13" fill="#6c584c">innen</text>
  <text x="898" y="130" font-size="13" fill="#6c584c">außen</text>
  <text x="690" y="344" font-size="13" fill="#414833">Auskragende Platte: durchstößt die</text>
  <text x="690" y="364" font-size="13" fill="#414833">Dämmebene und wirkt wie eine Kühlrippe.</text>
</svg>
