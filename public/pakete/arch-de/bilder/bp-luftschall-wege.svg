<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680">
<defs>
<pattern id="mw" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="14" height="14" fill="#a98467"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#6c584c" stroke-width="1.1" opacity="0.55"/>
</pattern>
<pattern id="dm" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#adc178"/>
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f7f3e4" stroke-width="2" opacity="0.7"/>
</pattern>
<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#dde5b6"/>
  <line x1="0" y1="0" x2="9" y2="9" stroke="#6c584c" stroke-width="0.9" opacity="0.5"/>
</pattern>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a6b1f"/></marker>
<marker id="pfk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6c584c"/></marker>
</defs>
<rect x="0" y="0" width="900" height="680" fill="#f0ead2"/>
<text x="450.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Wege des Luftschalls in den Raum</text>
<text x="450.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Vertikalschnitt durch die Außenwand — die Anforderung gilt dem gesamten Außenbauteil im eingebauten Zustand</text>
<text x="62" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#6c584c" font-weight="bold" font-style="normal">außen</text>
<text x="838" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#6c584c" font-weight="bold" font-style="normal">innen</text>
<rect x="300" y="96" width="64" height="54" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<circle cx="332.0" cy="123" r="15" fill="#d9d2b4" stroke="#414833" stroke-width="1.6"/>
<rect x="300" y="150" width="64" height="18" fill="#adc178" stroke="#414833" stroke-width="1.6"/>
<rect x="300" y="168" width="64" height="108" fill="url(#hz)" stroke="#414833" stroke-width="2"/>
<line x1="327.0" y1="180" x2="327.0" y2="264" stroke="#6c584c" stroke-width="2.6"/>
<line x1="337.0" y1="180" x2="337.0" y2="264" stroke="#6c584c" stroke-width="2.6"/>
<rect x="300" y="276" width="64" height="154" fill="url(#mw)" stroke="#414833" stroke-width="2"/>
<rect x="352" y="286" width="438" height="24" fill="#d9d2b4" stroke="#414833" stroke-width="1.8"/>
<text x="660" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Geschossdecke</text>
<rect x="364" y="266" width="426" height="20" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<rect x="364" y="275" width="8" height="11" fill="#adc178" stroke="#414833" stroke-width="1.2"/>
<text x="690" y="254" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">schwimmender Estrich auf Randstreifen</text>
<path d="M132,160 q13,-7 26,0 q13,7 26,0 q13,-7 26,0 q13,7 26,0 q13,-7 26,0" fill="none" stroke="#9a6b1f" stroke-width="2.6" marker-end="url(#pf)"/>
<path d="M132,222 q13,-7 26,0 q13,7 26,0 q13,-7 26,0 q13,7 26,0 q13,-7 26,0" fill="none" stroke="#9a6b1f" stroke-width="2.6" marker-end="url(#pf)"/>
<path d="M132,372 q13,-7 26,0 q13,7 26,0 q13,-7 26,0 q13,7 26,0 q13,-7 26,0" fill="none" stroke="#9a6b1f" stroke-width="2.6" marker-end="url(#pf)"/>
<text x="132" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#9a6b1f" font-weight="bold" font-style="normal">Außenlärm</text>
<path d="M392,222 q13,-6 26,0 q13,6 26,0 q13,-6 26,0 q13,6 26,0" fill="none" stroke="#9a6b1f" stroke-width="2.2" marker-end="url(#pf)"/>
<path d="M640,352 q13,-6 26,0 q13,6 26,0 q13,-6 26,0 q13,6 26,0" fill="none" stroke="#6c584c" stroke-width="2.2" marker-end="url(#pfk)"/>
<line x1="271" y1="120" x2="298" y2="123" stroke="#414833" stroke-width="1.4"/>
<circle cx="332" cy="372" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="332" y="377" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">1</text>
<circle cx="332" cy="238" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="332" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">2</text>
<circle cx="332" cy="160" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="332" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">3</text>
<circle cx="560" cy="298" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="560" y="303" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">4</text>
<circle cx="398" cy="273" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="398" y="278" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">5</text>
<circle cx="258" cy="118" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="258" y="123" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">6</text>
<line x1="44" y1="500" x2="856" y2="500" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="50" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">1</text>
<text x="72" y="526" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Weg durch die Außenwand — hier entscheidet die Masse</text>
<text x="50" y="547" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">2</text>
<text x="72" y="547" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Weg durch das Fenster — meist das schwächste Einzelbauteil</text>
<text x="50" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">3</text>
<text x="72" y="568" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Weg durch die Bauteilanschlussfuge</text>
<text x="50" y="589" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">4</text>
<text x="72" y="589" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">flankierende Übertragung über die Decke (Schalllängsleitung)</text>
<text x="50" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">5</text>
<text x="72" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Schallbrücke: Der schwimmende Estrich berührt die Wand an einer Stelle.</text>
<text x="50" y="631" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">6</text>
<text x="72" y="631" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Rollladenkasten — zählt zum Außenbauteil und wird mitgerechnet</text>
<text x="50" y="668" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a6b1f" font-weight="normal" font-style="italic">Die Anforderung wird als resultierendes Schalldämmmaß erf. R'w,res an die Summe aller Einzelbauteile gestellt.</text>
</svg>