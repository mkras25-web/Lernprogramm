<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 450" width="470" height="450">
<defs>
<pattern id="mw" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="14" height="14" fill="#a98467"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#6c584c" stroke-width="1.1" opacity="0.55"/>
</pattern>
<pattern id="dm" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#adc178"/>
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f7f3e4" stroke-width="2" opacity="0.7"/>
</pattern>
<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#dde5b6"/>
  <line x1="0" y1="0" x2="9" y2="9" stroke="#6c584c" stroke-width="0.9" opacity="0.5"/>
</pattern>
<pattern id="bt" width="12" height="12" patternUnits="userSpaceOnUse">
  <rect width="12" height="12" fill="#d9d2b4"/>
  <circle cx="3" cy="4" r="1.4" fill="#6c584c" opacity="0.5"/>
  <circle cx="9" cy="9" r="1.1" fill="#6c584c" opacity="0.5"/>
</pattern>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a6b1f"/></marker>
<marker id="pfk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6c584c"/></marker>
</defs>
<rect x="0" y="0" width="470" height="450" fill="#f0ead2"/>
<text x="235.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Terrassenanschluss A</text>
<text x="235.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Vertikalschnitt am Übergang vom Innenraum nach draußen</text>
<path d="M40,266 L430,266 L430,360 L40,360 Z" fill="url(#bt)" stroke="#414833" stroke-width="2"/>
<text x="140" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Geschossdecke</text>
<rect x="40" y="250" width="210" height="16" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<text x="140" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Innenboden</text>
<rect x="224" y="120" width="26" height="130" fill="url(#hz)" stroke="#414833" stroke-width="2"/>
<text x="237" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Tür</text>
<rect x="250" y="266" width="180" height="16" fill="#a98467" stroke="#414833" stroke-width="1.6"/>
<line x1="256" y1="250" x2="256" y2="266" stroke="#9a6b1f" stroke-width="3"/>
<text x="262" y="244" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#9a6b1f" font-weight="bold" font-style="normal">Stufe</text>
<text x="362" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Terrassenbelag</text>
<text x="56" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6c584c" font-weight="bold" font-style="normal">innen</text>
<text x="416" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="end" fill="#6c584c" font-weight="bold" font-style="normal">außen</text>
<text x="28" y="378" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Der Übergang wird mit einer Stufe gelöst. Der</text>
<text x="28" y="395" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Außenbelag liegt tiefer als der Innenboden,</text>
<text x="28" y="412" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">die Geschossdecke bleibt an der Öffnung durchgehend.</text>
</svg>