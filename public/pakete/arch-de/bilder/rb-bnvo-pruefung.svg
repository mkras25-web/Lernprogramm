<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="530" fill="#f0ead2"/>
<rect x="20" y="30" width="560" height="70" rx="6" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<circle cx="50" cy="65" r="15" fill="#414833" stroke="#f7f3e4" stroke-width="2"/>
<text x="50" y="70" font-size="15" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >1</text>
<text x="78" y="60" font-size="17" text-anchor="start" font-weight="bold" fill="#414833" >Welches Baugebiet ist festgesetzt?</text>
<text x="78" y="84" font-size="16" text-anchor="start" font-weight="normal" fill="#6c584c" >§§ 2–14 BauNVO werden Bestandteil des Plans (§ 1 Abs. 3)</text>
<line x1="300.0" y1="100" x2="300.0" y2="121" stroke="#414833" stroke-width="2.5"/>
<polygon points="293.0,119 307.0,119 300.0,130" fill="#414833"/>
<rect x="20" y="130" width="560" height="70" rx="6" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<circle cx="50" cy="165" r="15" fill="#414833" stroke="#f7f3e4" stroke-width="2"/>
<text x="50" y="170" font-size="15" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >2</text>
<text x="78" y="160" font-size="17" text-anchor="start" font-weight="bold" fill="#414833" >Hat der Plan den Katalog abgewandelt?</text>
<text x="78" y="184" font-size="16" text-anchor="start" font-weight="normal" fill="#6c584c" >Gliederung, Ausschlüsse, geschossweise Regeln (§ 1 Abs. 4–10)</text>
<line x1="300.0" y1="200" x2="300.0" y2="221" stroke="#414833" stroke-width="2.5"/>
<polygon points="293.0,219 307.0,219 300.0,230" fill="#414833"/>
<rect x="20" y="230" width="560" height="70" rx="6" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<circle cx="50" cy="265" r="15" fill="#414833" stroke="#f7f3e4" stroke-width="2"/>
<text x="50" y="270" font-size="15" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >3</text>
<text x="78" y="260" font-size="17" text-anchor="start" font-weight="bold" fill="#414833" >Allgemein zulässig nach Absatz 2?</text>
<text x="78" y="284" font-size="16" text-anchor="start" font-weight="normal" fill="#6c584c" >ja: Anspruch auf Zulassung – weiter mit 5</text>
<line x1="300.0" y1="300" x2="300.0" y2="321" stroke="#414833" stroke-width="2.5"/>
<polygon points="293.0,319 307.0,319 300.0,330" fill="#414833"/>
<rect x="20" y="330" width="560" height="70" rx="6" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<circle cx="50" cy="365" r="15" fill="#414833" stroke="#f7f3e4" stroke-width="2"/>
<text x="50" y="370" font-size="15" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >4</text>
<text x="78" y="360" font-size="17" text-anchor="start" font-weight="bold" fill="#414833" >Falls nicht: ausnahmsweise nach Absatz 3?</text>
<text x="78" y="384" font-size="16" text-anchor="start" font-weight="normal" fill="#6c584c" >ja: Ausnahme nach § 31 Abs. 1 BauGB, Ermessen</text>
<line x1="300.0" y1="400" x2="300.0" y2="421" stroke="#414833" stroke-width="2.5"/>
<polygon points="293.0,419 307.0,419 300.0,430" fill="#414833"/>
<rect x="20" y="430" width="560" height="70" rx="6" fill="#adc178" stroke="#414833" stroke-width="1.6"/>
<circle cx="50" cy="465" r="15" fill="#414833" stroke="#f7f3e4" stroke-width="2"/>
<text x="50" y="470" font-size="15" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >5</text>
<text x="78" y="460" font-size="17" text-anchor="start" font-weight="bold" fill="#414833" >Einzelfallprüfung nach § 15 Abs. 1</text>
<text x="78" y="484" font-size="16" text-anchor="start" font-weight="normal" fill="#6c584c" >Widerspruch zur Eigenart? Unzumutbare Störungen?</text>
<line x1="580" y1="365" x2="602" y2="365" stroke="#9a6b1f" stroke-width="2.5"/>
<polygon points="600,358 600,372 612,365" fill="#9a6b1f"/>
<rect x="614" y="313" width="180" height="104" rx="6" fill="#f7f3e4" stroke="#9a6b1f" stroke-width="2"/>
<text x="704.0" y="339" font-size="16" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >nein:</text>
<text x="704.0" y="360" font-size="16" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >unzulässig</text>
<text x="704.0" y="384" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >allenfalls Befreiung</text>
<text x="704.0" y="404" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >(§ 31 Abs. 2 BauGB)</text>
</svg>
