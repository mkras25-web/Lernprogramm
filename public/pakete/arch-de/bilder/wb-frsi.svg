<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 440" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="mwF" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#a98467"/>
      <line x1="0" y1="11" x2="22" y2="11" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
      <line x1="11" y1="0" x2="11" y2="11" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
      <line x1="0" y1="11" x2="0" y2="22" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="980" height="440" fill="#f0ead2"/>

  <!-- Schnitt -->
  <rect x="60" y="120" width="50" height="200" fill="#ffffff" opacity="0.45"/>
  <rect x="110" y="120" width="120" height="200" fill="url(#mwF)" stroke="#414833" stroke-width="1.6"/>
  <rect x="230" y="120" width="110" height="200" fill="#ffffff" opacity="0.45"/>

  <g font-size="14" fill="#414833">
    <text x="85" y="106" text-anchor="middle">außen</text>
    <text x="285" y="106" text-anchor="middle">innen</text>
    <text x="85" y="345" text-anchor="middle">&#952;&#8337; = −5 °C</text>
    <text x="285" y="345" text-anchor="middle">&#952;&#7522; = +20 °C</text>
  </g>
  <circle cx="230" cy="220" r="5" fill="#414833"/>
  <text x="244" y="216" font-size="14" fill="#414833">&#952;&#8347;&#7522; – raumseitige</text>
  <text x="244" y="235" font-size="14" fill="#414833">Oberflächentemperatur</text>

  <text x="60" y="400" font-size="17" fill="#414833">fRsi = (&#952;&#8347;&#7522; − &#952;&#8337;) / (&#952;&#7522; − &#952;&#8337;)</text>

  <!-- Skala -->
  <rect x="560" y="100" width="44" height="210" fill="#adc178" opacity="0.5"/>
  <rect x="560" y="310" width="44" height="70" fill="#9a6b1f" opacity="0.35"/>
  <rect x="560" y="100" width="44" height="280" fill="none" stroke="#414833" stroke-width="1.4"/>

  <g stroke="#414833" stroke-width="1.4">
    <line x1="604" y1="142" x2="624" y2="142"/>
    <line x1="604" y1="240" x2="624" y2="240"/>
  </g>
  <line x1="552" y1="310" x2="624" y2="310" stroke="#414833" stroke-width="2.6"/>
  <line x1="604" y1="324" x2="624" y2="324" stroke="#9a6b1f" stroke-width="1.4"/>
  <g font-size="13" fill="#414833" stroke="none">
    <text x="632" y="147">0,94 – mit thermischer Trennung (&#952;&#8347;&#7522; = 18,5 °C)</text>
    <text x="632" y="245">0,80 – erstrebenswert</text>
    <text x="632" y="304" font-weight="600">0,70 – Grenzwert, entspricht &#952;&#8347;&#7522; = 12,6 °C</text>
  </g>
  <text x="632" y="338" font-size="13" fill="#9a6b1f" stroke="none">0,68 – ohne thermische Trennung (&#952;&#8347;&#7522; = 12,5 °C)</text>
  <g font-size="13" fill="#6c584c">
    <text x="582" y="92" text-anchor="middle">fRsi</text>
    <text x="548" y="105" text-anchor="end">1,00</text>
    <text x="548" y="384" text-anchor="end">0,60</text>
  </g>
</svg>
