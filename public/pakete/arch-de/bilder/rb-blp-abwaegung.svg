<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 455" width="800" height="455" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="455" fill="#f0ead2"/>
<defs><marker id="spitze" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#414833"/></marker></defs>
<text x="400" y="34" font-size="19" text-anchor="middle" font-weight="bold" fill="#414833" >Die vier Stufen der Abwägung und ihre Fehler</text>
<polygon points="20,70 188,70 206,120 188,170 20,170 38,120" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="50" y="100" font-size="16" text-anchor="start" font-weight="bold" fill="#9a6b1f" >1</text>
<text x="116" y="118" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >Abwägung</text>
<text x="116" y="138" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >findet statt</text>
<line x1="110" y1="172" x2="110" y2="222" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<text x="118" y="202" font-size="12" text-anchor="start" font-weight="normal" fill="#6c584c" >Fehler</text>
<rect x="26" y="224" width="170" height="62" rx="8" fill="#f7f3e4" stroke="#9a6b1f" stroke-width="2"/>
<text x="111" y="250" font-size="15" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >Abwägungs-</text>
<text x="111" y="269" font-size="15" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >ausfall</text>
<polygon points="212,70 380,70 398,120 380,170 212,170 230,120" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="242" y="100" font-size="16" text-anchor="start" font-weight="bold" fill="#9a6b1f" >2</text>
<text x="308" y="118" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >Belange ermitteln</text>
<text x="308" y="138" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >und einstellen</text>
<line x1="302" y1="172" x2="302" y2="222" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<text x="310" y="202" font-size="12" text-anchor="start" font-weight="normal" fill="#6c584c" >Fehler</text>
<rect x="218" y="224" width="170" height="62" rx="8" fill="#f7f3e4" stroke="#9a6b1f" stroke-width="2"/>
<text x="303" y="250" font-size="15" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >Abwägungs-</text>
<text x="303" y="269" font-size="15" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >defizit</text>
<polygon points="404,70 572,70 590,120 572,170 404,170 422,120" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="434" y="100" font-size="16" text-anchor="start" font-weight="bold" fill="#9a6b1f" >3</text>
<text x="500" y="118" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >Belange bewerten</text>
<text x="500" y="138" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >und gewichten</text>
<line x1="494" y1="172" x2="494" y2="222" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<text x="502" y="202" font-size="12" text-anchor="start" font-weight="normal" fill="#6c584c" >Fehler</text>
<rect x="410" y="224" width="170" height="62" rx="8" fill="#f7f3e4" stroke="#9a6b1f" stroke-width="2"/>
<text x="495" y="250" font-size="15" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >Abwägungs-</text>
<text x="495" y="269" font-size="15" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >fehleinschätzung</text>
<polygon points="596,70 764,70 782,120 764,170 596,170 614,120" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="626" y="100" font-size="16" text-anchor="start" font-weight="bold" fill="#9a6b1f" >4</text>
<text x="692" y="118" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >Ausgleich</text>
<text x="692" y="138" font-size="15" text-anchor="middle" font-weight="bold" fill="#414833" >herstellen</text>
<line x1="686" y1="172" x2="686" y2="222" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<text x="694" y="202" font-size="12" text-anchor="start" font-weight="normal" fill="#6c584c" >Fehler</text>
<rect x="602" y="224" width="170" height="62" rx="8" fill="#f7f3e4" stroke="#9a6b1f" stroke-width="2"/>
<text x="687" y="250" font-size="15" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >Abwägungs-</text>
<text x="687" y="269" font-size="15" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >disproportionalität</text>
<line x1="20" y1="318" x2="780" y2="318" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="40" y="348" font-size="15" text-anchor="start" font-weight="normal" fill="#414833" >Geprüft werden der Abwägungsvorgang (das Verfahren) und das</text>
<text x="40" y="372" font-size="15" text-anchor="start" font-weight="normal" fill="#414833" >Abwägungsergebnis (der Planinhalt) – § 1 Abs. 7, § 2 Abs. 3 BauGB.</text>
<text x="40" y="406" font-size="15" text-anchor="start" font-weight="normal" fill="#6c584c" >Innerhalb dieses Rahmens darf die Gemeinde einen Belang bevorzugen</text>
<text x="40" y="430" font-size="15" text-anchor="start" font-weight="normal" fill="#6c584c" >und einen anderen zurückstellen: planerische Gestaltungsfreiheit.</text>
</svg>
