<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 430" width="470" height="430">
<defs>
<pattern id="mw" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="14" height="14" fill="#a98467"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#6c584c" stroke-width="1.1" opacity="0.55"/>
</pattern>
<pattern id="dm" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#adc178"/>
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f7f3e4" stroke-width="2" opacity="0.7"/>
</pattern>
<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#dde5b6"/>
  <line x1="0" y1="0" x2="9" y2="9" stroke="#6c584c" stroke-width="0.9" opacity="0.5"/>
</pattern>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a6b1f"/></marker>
<marker id="pfk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6c584c"/></marker>
</defs>
<rect x="0" y="0" width="470" height="430" fill="#f0ead2"/>
<text x="235.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Einbaufall B</text>
<text x="235.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Dasselbe Fenster, dieselbe Wand — nur die Fuge ist anders ausgeführt</text>
<rect x="56" y="110" width="118" height="200" fill="url(#mw)" stroke="#414833" stroke-width="2"/>
<rect x="230" y="110" width="184" height="200" fill="url(#hz)" stroke="#414833" stroke-width="2"/>
<text x="115" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Wand</text>
<text x="322" y="100" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Blendrahmen</text>
<line x1="174" y1="96" x2="230" y2="96" stroke="#414833" stroke-width="1.3"/>
<line x1="174" y1="90" x2="174" y2="102" stroke="#414833" stroke-width="1.3"/>
<line x1="230" y1="90" x2="230" y2="102" stroke="#414833" stroke-width="1.3"/>
<text x="202" y="84" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#414833" font-weight="normal" font-style="normal">Fuge</text>
<rect x="174" y="110" width="56" height="200" fill="url(#dm)" stroke="#414833" stroke-width="1.8"/>
<text x="202" y="216" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="bold" font-style="normal"></text>
<text x="28" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Die Fuge ist über die ganze Tiefe mit PUR-Montage-</text>
<text x="28" y="370" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">schaum ausgefüllt; der Schaum haftet an beiden</text>
<text x="28" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Fugenflanken. Keine Haarfuge, kein Keilloch.</text>
</svg>