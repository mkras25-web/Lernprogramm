<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
<defs>
<pattern id="mw" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="14" height="14" fill="#a98467"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#6c584c" stroke-width="1.1" opacity="0.55"/>
</pattern>
<pattern id="dm" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#adc178"/>
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f7f3e4" stroke-width="2" opacity="0.7"/>
</pattern>
<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#dde5b6"/>
  <line x1="0" y1="0" x2="9" y2="9" stroke="#6c584c" stroke-width="0.9" opacity="0.5"/>
</pattern>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a6b1f"/></marker>
<marker id="pfk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6c584c"/></marker>
</defs>
<rect x="0" y="0" width="900" height="480" fill="#f0ead2"/>
<text x="450.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Warum Schallschutzfenster asymmetrisch aufgebaut sind</text>
<text x="450.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Horizontalschnitt durch die Verglasung, stark vergrößert</text>
<text x="220" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">symmetrisch</text>
<rect x="100" y="130" width="14" height="150" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<rect x="114" y="130" width="96" height="150" fill="#f7f3e4" stroke="#d9d2b4" stroke-width="1.2"/>
<rect x="210" y="130" width="14" height="150" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<text x="162" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Scheiben-</text>
<text x="162" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">zwischenraum</text>
<text x="107.0" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">14 mm</text>
<text x="217.0" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">14 mm</text>
<text x="94" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">außen</text>
<text x="230" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="end" fill="#6c584c" font-weight="normal" font-style="normal">innen</text>
<path d="M46,205 q13,-6 26,0 q13,6 26,0" fill="none" stroke="#9a6b1f" stroke-width="2.2" marker-end="url(#pf)"/>
<text x="220" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Beide Scheiben haben dieselbe Eigenresonanzfrequenz.</text>
<text x="650" y="98" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">asymmetrisch</text>
<rect x="530" y="130" width="22" height="150" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<rect x="552" y="130" width="96" height="150" fill="#f7f3e4" stroke="#d9d2b4" stroke-width="1.2"/>
<rect x="648" y="130" width="10" height="150" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<text x="600" y="212" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Scheiben-</text>
<text x="600" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">zwischenraum</text>
<text x="541.0" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">22 mm</text>
<text x="653.0" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">10 mm</text>
<text x="524" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">außen</text>
<text x="664" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="end" fill="#6c584c" font-weight="normal" font-style="normal">innen</text>
<path d="M476,205 q13,-6 26,0 q13,6 26,0" fill="none" stroke="#9a6b1f" stroke-width="2.2" marker-end="url(#pf)"/>
<text x="650" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Verschiedene Dicken, verschiedene Eigenresonanzfrequenzen.</text>
<line x1="56" y1="360" x2="844" y2="360" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="56" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Aus Sicht des Schallschutzes ist unerheblich, welche Scheibe außen liegt. Aus Gründen der Lastabtragung — vor allem Windlast —</text>
<text x="56" y="406" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">wird jedoch meist die dickere Scheibe außen eingebaut.</text>
<text x="56" y="436" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a6b1f" font-weight="normal" font-style="italic">Dreifachverglasung erreicht vergleichbare Werte; die Mittelscheibe hat praktisch keinen Einfluss auf das Ergebnis.</text>
</svg>