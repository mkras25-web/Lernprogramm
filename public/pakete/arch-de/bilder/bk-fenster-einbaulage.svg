<text x="62" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Wärmedämmung auf der raumseitigen Laibung — damit bleibt der außenbündige Anschluss bei rund 55 % Luftfeuchte tauwasserfrei.</text>
<text x="30" y="497" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a6b1f" font-weight="normal" font-style="italic">Nur Fall C ist durchgängig ungünstig: niedrigste Oberflächentemperatur und zugleich größter Wärmeverlust.</text>
<text x="30" y="521" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">Berechnete Werte nach Lehrbuch der Bauphysik, Tafel 7.1, gedr. S. 198.</text>
