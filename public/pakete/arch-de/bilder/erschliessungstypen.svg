<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Erschließungstypen im Wohnungsbau, schematische Grundrisse" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="kern" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#9aa08f" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="720" height="420" fill="#ffffff"/>

  <g font-family="Georgia, serif" font-size="13" fill="#414833">

    <!-- Einspänner -->
    <g transform="translate(30,30)">
      <rect x="0" y="0" width="150" height="120" fill="none" stroke="#414833" stroke-width="1.6"/>
      <rect x="58" y="44" width="34" height="32" fill="url(#kern)" stroke="#414833" stroke-width="1"/>
      <text x="75" y="140" text-anchor="middle">Einspänner</text>
      <text x="75" y="157" text-anchor="middle" font-size="11" fill="#6c584c">1 WE · bis 4 Seiten</text>
    </g>

    <!-- Zweispänner -->
    <g transform="translate(220,30)">
      <rect x="0" y="0" width="220" height="120" fill="none" stroke="#414833" stroke-width="1.6"/>
      <line x1="110" y1="0" x2="110" y2="120" stroke="#414833" stroke-width="1"/>
      <rect x="93" y="44" width="34" height="32" fill="url(#kern)" stroke="#414833" stroke-width="1"/>
      <text x="110" y="140" text-anchor="middle">Zweispänner</text>
      <text x="110" y="157" text-anchor="middle" font-size="11" fill="#6c584c">2 WE · 2–3 Seiten</text>
    </g>

    <!-- Vierspänner -->
    <g transform="translate(480,30)">
      <rect x="0" y="0" width="210" height="120" fill="none" stroke="#414833" stroke-width="1.6"/>
      <line x1="105" y1="0" x2="105" y2="120" stroke="#414833" stroke-width="1"/>
      <line x1="0" y1="60" x2="210" y2="60" stroke="#414833" stroke-width="1"/>
      <rect x="88" y="44" width="34" height="32" fill="url(#kern)" stroke="#414833" stroke-width="1"/>
      <text x="105" y="140" text-anchor="middle">Vierspänner</text>
      <text x="105" y="157" text-anchor="middle" font-size="11" fill="#6c584c">4 WE · 1–2 Seiten</text>
    </g>

    <!-- Laubengang -->
    <g transform="translate(30,230)">
      <rect x="0" y="26" width="300" height="94" fill="none" stroke="#414833" stroke-width="1.6"/>
      <rect x="0" y="0" width="300" height="26" fill="none" stroke="#414833" stroke-width="1" stroke-dasharray="5 3"/>
      <line x1="75" y1="26" x2="75" y2="120" stroke="#414833" stroke-width="1"/>
      <line x1="150" y1="26" x2="150" y2="120" stroke="#414833" stroke-width="1"/>
      <line x1="225" y1="26" x2="225" y2="120" stroke="#414833" stroke-width="1"/>
      <rect x="-34" y="26" width="34" height="40" fill="url(#kern)" stroke="#414833" stroke-width="1"/>
      <text x="150" y="17" text-anchor="middle" font-size="11" fill="#6c584c">Laubengang</text>
      <text x="150" y="140" text-anchor="middle">Laubengangtyp</text>
      <text x="150" y="157" text-anchor="middle" font-size="11" fill="#6c584c">viele WE je Kern · 1 Seite frei</text>
    </g>

    <!-- Mittelflur -->
    <g transform="translate(430,230)">
      <rect x="0" y="0" width="260" height="120" fill="none" stroke="#414833" stroke-width="1.6"/>
      <line x1="0" y1="50" x2="260" y2="50" stroke="#414833" stroke-width="1"/>
      <line x1="0" y1="70" x2="260" y2="70" stroke="#414833" stroke-width="1"/>
      <line x1="65" y1="0" x2="65" y2="50" stroke="#414833" stroke-width="1"/>
      <line x1="130" y1="0" x2="130" y2="50" stroke="#414833" stroke-width="1"/>
      <line x1="195" y1="0" x2="195" y2="50" stroke="#414833" stroke-width="1"/>
      <line x1="65" y1="70" x2="65" y2="120" stroke="#414833" stroke-width="1"/>
      <line x1="130" y1="70" x2="130" y2="120" stroke="#414833" stroke-width="1"/>
      <line x1="195" y1="70" x2="195" y2="120" stroke="#414833" stroke-width="1"/>
      <rect x="226" y="50" width="34" height="20" fill="url(#kern)" stroke="#414833" stroke-width="1"/>
      <text x="130" y="140" text-anchor="middle">Mittelflur (Zweibund)</text>
      <text x="130" y="157" text-anchor="middle" font-size="11" fill="#6c584c">einseitig · keine Querlüftung</text>
    </g>

    <text x="30" y="205" font-size="11" fill="#6c584c">Schraffur: Erschließungskern mit Treppe und Aufzug</text>
  </g>
</svg>
