<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="620" fill="#f0ead2"/>
<text x="400" y="36" font-size="22" text-anchor="middle" font-weight="bold" fill="#414833">Die am Bau Beteiligten und weitere Beauftragte</text>
<text x="400" y="62" font-size="17" text-anchor="middle" fill="#6c584c">(§§ 55–59 und 68 HBO)</text>
<rect x="170" y="84" width="300" height="72" rx="8" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="320" y="116" font-size="22" text-anchor="middle" font-weight="bold" fill="#414833">Bauherrschaft</text>
<text x="320" y="143" font-size="17" text-anchor="middle" fill="#6c584c">§ 56</text>
<rect x="600" y="84" width="180" height="72" rx="8" fill="#a98467" stroke="#414833" stroke-width="2"/>
<text x="690" y="116" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f2318">Bauaufsicht</text>
<text x="690" y="143" font-size="17" text-anchor="middle" fill="#1f2318">§§ 60, 61</text>
<line x1="470" y1="120" x2="598" y2="120" stroke="#414833" stroke-width="2.2"/>
<polygon points="598,120 584,113 584,127" fill="#414833"/>
<text x="534" y="94" font-size="16" text-anchor="middle" fill="#6c584c">Anträge,</text>
<text x="534" y="112" font-size="16" text-anchor="middle" fill="#6c584c">Anzeigen,</text>
<text x="534" y="142" font-size="16" text-anchor="middle" fill="#6c584c">Nachweise</text>
<rect x="16" y="200" width="452" height="246" rx="10" fill="#e6dfc3"/>
<rect x="480" y="200" width="304" height="246" rx="10" fill="#e6dfc3"/>
<text x="262" y="172" font-size="17" text-anchor="end" font-weight="bold" fill="#6c584c">beauftragt (§ 56 Abs. 4)</text>
<line x1="320" y1="156" x2="94" y2="232" stroke="#414833" stroke-width="2"/>
<line x1="320" y1="156" x2="242" y2="232" stroke="#414833" stroke-width="2"/>
<line x1="320" y1="156" x2="390" y2="232" stroke="#414833" stroke-width="2"/>
<line x1="320" y1="156" x2="558" y2="232" stroke="#414833" stroke-width="2"/>
<line x1="320" y1="156" x2="706" y2="232" stroke="#414833" stroke-width="2"/>
<rect x="26" y="232" width="136" height="90" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="94" y="261" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833">Entwurfs-</text>
<text x="94" y="283" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833">verfassende</text>
<text x="94" y="309" font-size="16" text-anchor="middle" fill="#6c584c">§ 57</text>
<rect x="174" y="232" width="136" height="90" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="242" y="261" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833">Unter-</text>
<text x="242" y="283" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833">nehmen</text>
<text x="242" y="309" font-size="16" text-anchor="middle" fill="#6c584c">§ 58</text>
<rect x="322" y="232" width="136" height="90" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="390" y="261" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833">Bau-</text>
<text x="390" y="283" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833">leitung</text>
<text x="390" y="309" font-size="16" text-anchor="middle" fill="#6c584c">§ 59</text>
<line x1="94" y1="322" x2="94" y2="350" stroke="#6c584c" stroke-width="1.8" stroke-dasharray="5 4"/>
<rect x="26" y="350" width="136" height="44" rx="8" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5"/>
<text x="94" y="378" font-size="16" text-anchor="middle" fill="#414833">Fachplanende</text>
<line x1="242" y1="322" x2="242" y2="350" stroke="#6c584c" stroke-width="1.8" stroke-dasharray="5 4"/>
<rect x="174" y="350" width="136" height="44" rx="8" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5"/>
<text x="242" y="378" font-size="16" text-anchor="middle" fill="#414833">Fachunternehmen</text>
<line x1="390" y1="322" x2="390" y2="350" stroke="#6c584c" stroke-width="1.8" stroke-dasharray="5 4"/>
<rect x="322" y="350" width="136" height="44" rx="8" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5"/>
<text x="390" y="378" font-size="16" text-anchor="middle" fill="#414833">Fachbauleitung</text>
<rect x="490" y="232" width="136" height="90" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="558" y="261" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833">Nachweis-</text>
<text x="558" y="283" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833">berechtigte</text>
<text x="558" y="309" font-size="16" text-anchor="middle" fill="#6c584c">§ 68 Abs. 1</text>
<rect x="638" y="232" width="136" height="90" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="706" y="261" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833">Prüfsach-</text>
<text x="706" y="283" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833">verständige</text>
<text x="706" y="309" font-size="16" text-anchor="middle" fill="#6c584c">§ 68 Abs. 3, 4</text>
<text x="558" y="364" font-size="16" text-anchor="middle" fill="#6c584c">stellen die</text>
<text x="558" y="385" font-size="16" text-anchor="middle" fill="#6c584c">Nachweise auf</text>
<text x="706" y="364" font-size="16" text-anchor="middle" fill="#6c584c">prüfen und</text>
<text x="706" y="385" font-size="16" text-anchor="middle" fill="#6c584c">bescheinigen</text>
<text x="242" y="430" font-size="16" text-anchor="middle" font-weight="bold" fill="#6c584c">am Bau Beteiligte (§§ 57–59)</text>
<text x="632" y="430" font-size="16" text-anchor="middle" font-weight="bold" fill="#6c584c">bautechnische Nachweise</text>
<line x1="20" y1="464" x2="780" y2="464" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="30" y="494" font-size="18" text-anchor="start" fill="#414833">§ 55: Die Bauherrschaft und im Rahmen ihres Wirkungskreises die</text>
<text x="30" y="518" font-size="18" text-anchor="start" fill="#414833">anderen am Bau Beteiligten sind dafür verantwortlich, dass die</text>
<text x="30" y="542" font-size="18" text-anchor="start" fill="#414833">öffentlich-rechtlichen Vorschriften eingehalten werden.</text>
<text x="30" y="576" font-size="18" text-anchor="start" fill="#6c584c">§§ 57–59: Wem auf einem Teilgebiet die Sachkunde fehlt, zieht Fachleute</text>
<text x="30" y="600" font-size="18" text-anchor="start" fill="#6c584c">hinzu und bleibt für das Zusammenwirken verantwortlich.</text>
</svg>
