<text x="46" y="192" font-size="14" text-anchor="start" font-weight="bold" fill="#414833" >H = 6,40 m + 4,50 m ÷ 3 = 7,90 m</text>
<text x="46" y="214" font-size="14" text-anchor="start" font-weight="normal" fill="#414833" >0,4 × 7,90 m = 3,16 m</text>
<text x="46" y="236" font-size="14" text-anchor="start" font-weight="bold" fill="#9a6b1f" >abgerundet auf 0,10 m: 3,10 m</text>
