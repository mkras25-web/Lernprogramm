<g font-size="16" text-anchor="start" fill="#414833">
<line x1="500" y1="420" x2="520" y2="420" stroke="#414833" stroke-width="1.5"/>
<text x="528" y="396" font-weight="bold">KG: Deckenoberkante im</text>
<text x="528" y="416">Mittel höchstens 1,40 m über</text>
