<text x="528" y="316" font-weight="bold">EG und OG: oberirdisch,</text>
<text x="528" y="336">Höhe mindestens 2,30 m</text>
<text x="528" y="356">– zwei Vollgeschosse</text>
<line x1="500" y1="211.0" x2="520" y2="211.0" stroke="#414833" stroke-width="1.5"/>
<text x="528" y="176" font-weight="bold">DG: 2,30 m Höhe nur über</text>
<text x="528" y="196">rund 6 m von 12 m Breite</text>
<text x="528" y="216">(50 %), also nicht über mehr</text>
<text x="528" y="236">als drei Viertel der Grund-</text>
<text x="528" y="256">fläche des OG – kein Vollgeschoss</text>
</g>
<text x="400" y="580" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >Vollgeschosse nach § 2 Abs. 5 HBO (schematisch): Zahl der Vollgeschosse = II</text>
