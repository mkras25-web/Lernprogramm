<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="820" height="620">
  <defs>
    <pattern id="sdMauer" width="36" height="18" patternUnits="userSpaceOnUse">
      <rect width="36" height="18" fill="#a98467"/>
      <path d="M0 0 H36 M0 9 H36 M0 18 H36" stroke="#8c6a53" stroke-width="1.2"/>
      <path d="M18 0 V9 M0 9 V18 M36 9 V18" stroke="#8c6a53" stroke-width="1.2"/>
    </pattern>
    <pattern id="sdDreieck" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#dde5b6"/>
      <path d="M-3 9 L9 -3 M0 12 L12 0 M3 15 L15 3" stroke="#adc178" stroke-width="2"/>
    </pattern>
    <pattern id="sdBeton" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#f7f3e4"/>
      <circle cx="4" cy="5" r="1.6" fill="#c3b894"/>
      <circle cx="12" cy="11" r="1.3" fill="#c3b894"/>
    </pattern>
  </defs>

  <rect width="820" height="620" fill="#f0ead2"/>

  <!-- Mauerwerk -->
  <path d="M80 92 H740 V460 H540 V320 H300 V460 H80 Z" fill="url(#sdMauer)" stroke="#414833" stroke-width="2"/>

  <!-- Decke ueber der Wand -->
  <rect x="60" y="44" width="700" height="48" fill="url(#sdBeton)" stroke="#414833" stroke-width="2"/>

  <!-- Belastungsdreieck, gleichseitig ueber der Stuetzweite -->
  <path d="M300 290 H540 L420 82 Z" fill="url(#sdDreieck)" stroke="#414833" stroke-width="2.4"/>
  <path d="M300 290 H540" stroke="#414833" stroke-width="2.4"/>

  <!-- Winkelmarkierungen -->
  <path d="M330 290 A30 30 0 0 0 315 264" fill="none" stroke="#6c584c" stroke-width="1.6"/>
  <path d="M510 290 A30 30 0 0 1 525 264" fill="none" stroke="#6c584c" stroke-width="1.6"/>
  <text x="340" y="282" font-family="Georgia, serif" font-size="15" fill="#6c584c">60°</text>
  <text x="470" y="282" font-family="Georgia, serif" font-size="15" fill="#6c584c">60°</text>

  <!-- Sturz -->
  <rect x="288" y="290" width="264" height="30" fill="url(#sdBeton)" stroke="#414833" stroke-width="2.4"/>

  <!-- Deckenlast oberhalb des Dreiecks -->
  <g stroke="#6c584c" stroke-width="2" fill="none">
    <path d="M150 100 V150 M210 100 V150 M630 100 V150 M690 100 V150"/>
  </g>
  <g fill="#6c584c">
    <path d="M150 160 l-6 -14 h12 z"/><path d="M210 160 l-6 -14 h12 z"/>
    <path d="M630 160 l-6 -14 h12 z"/><path d="M690 160 l-6 -14 h12 z"/>
  </g>

  <!-- Stuetzweite -->
  <g stroke="#6c584c" stroke-width="1.4" fill="none">
    <path d="M300 500 H540"/>
    <path d="M300 492 v16 M540 492 v16"/>
  </g>
  <text x="420" y="524" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#6c584c">Stützweite s</text>

  <!-- Nummern -->
  <g font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle">
    <g fill="#414833"><circle cx="420" cy="196" r="15" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="420" y="202">1</text></g>
    <g fill="#414833"><circle cx="612" cy="305" r="15" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="612" y="311">2</text></g>
    <g fill="#414833"><circle cx="420" cy="396" r="15" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="420" y="402">3</text></g>
    <g fill="#414833"><circle cx="180" cy="68" r="15" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="180" y="74">4</text></g>
    <g fill="#414833"><circle cx="180" cy="396" r="15" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="180" y="402">5</text></g>
  </g>
  <path d="M597 305 H552" stroke="#414833" stroke-width="1.3" fill="none"/>

  <path d="M60 556 H760" stroke="#d9d2b4" stroke-width="2"/>
  <g font-family="Georgia, serif" font-size="17" fill="#414833">
    <text x="60" y="586">1  Belastungsdreieck, gleichseitig</text>
    <text x="60" y="610">3  lichte Maueröffnung</text>
    <text x="430" y="586">2  Sturz</text>
    <text x="430" y="610">4  Deckenlast — 5  Widerlager</text>
  </g>
</svg>
