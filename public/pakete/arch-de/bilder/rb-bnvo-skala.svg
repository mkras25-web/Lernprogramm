<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 703" width="800" height="703" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="703" fill="#f0ead2"/>
<text x="44.0" y="36" font-size="16" text-anchor="middle" font-weight="bold" fill="#6c584c" >Baufläche</text>
<text x="112" y="36" font-size="16" text-anchor="middle" font-weight="bold" fill="#6c584c" >§</text>
<text x="166.0" y="36" font-size="16" text-anchor="middle" font-weight="bold" fill="#6c584c" >Kürzel</text>
<text x="208" y="36" font-size="16" text-anchor="start" font-weight="bold" fill="#6c584c" >Baugebiet</text>
<text x="416" y="36" font-size="16" text-anchor="start" font-weight="bold" fill="#6c584c" >Zweckbestimmung (Abs. 1, verkürzt)</text>
<rect x="84" y="52" width="704" height="48" fill="#f7f3e4"/>
<text x="112" y="82.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 2</text>
<rect x="136" y="61.0" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="82.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >WS</text>
<text x="208" y="82.0" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Kleinsiedlungsgebiet</text>
<text x="416" y="72.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >vorwiegend Kleinsiedlungen mit Nutzgärten</text>
<text x="416" y="91.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >und Nebenerwerbsstellen</text>
<rect x="84" y="100" width="704" height="44" fill="#efe8cf"/>
<text x="112" y="128.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 3</text>
<rect x="136" y="107.0" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="128.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >WR</text>
<text x="208" y="128.0" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Reines Wohngebiet</text>
<text x="416" y="128.0" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >dient dem Wohnen</text>
<rect x="84" y="144" width="704" height="44" fill="#f7f3e4"/>
<text x="112" y="172.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 4</text>
<rect x="136" y="151.0" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="172.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >WA</text>
<text x="208" y="172.0" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Allgemeines Wohngebiet</text>
<text x="416" y="172.0" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >dient vorwiegend dem Wohnen</text>
<rect x="84" y="188" width="704" height="48" fill="#efe8cf"/>
<text x="112" y="218.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 4a</text>
<rect x="136" y="197.0" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="218.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >WB</text>
<text x="208" y="218.0" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Besonderes Wohngebiet</text>
<text x="416" y="208.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >Wohnen in bebauten Gebieten erhalten,</text>
<text x="416" y="227.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >vereinbares Gewerbe</text>
<rect x="84" y="236" width="704" height="48" fill="#f7f3e4"/>
<text x="112" y="266.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 5</text>
<rect x="136" y="245.0" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="266.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >MD</text>
<text x="208" y="266.0" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Dorfgebiet</text>
<text x="416" y="256.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >Land- und Forstwirtschaft, Wohnen,</text>
<text x="416" y="275.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >nicht wesentlich störendes Gewerbe</text>
<rect x="84" y="284" width="704" height="67" fill="#efe8cf"/>
<text x="112" y="323.5" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 5a</text>
<rect x="136" y="302.5" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="323.5" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >MDW</text>
<text x="208" y="323.5" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Dörfliches Wohngebiet</text>
<text x="416" y="304.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >Wohnen, Nebenerwerbsstellen, nicht</text>
<text x="416" y="323.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >wesentlich störendes Gewerbe; Mischung</text>
<text x="416" y="342.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >nicht gleichgewichtig</text>
<rect x="84" y="351" width="704" height="48" fill="#f7f3e4"/>
<text x="112" y="381.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 6</text>
<rect x="136" y="360.0" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="381.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >MI</text>
<text x="208" y="381.0" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Mischgebiet</text>
<text x="416" y="371.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >Wohnen und Gewerbe, das das Wohnen</text>
<text x="416" y="390.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >nicht wesentlich stört</text>
<rect x="84" y="399" width="704" height="48" fill="#efe8cf"/>
<text x="112" y="429.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 6a</text>
<rect x="136" y="408.0" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="429.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >MU</text>
<text x="208" y="429.0" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Urbanes Gebiet</text>
<text x="416" y="419.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >wie MI, Mischung muss aber</text>
<text x="416" y="438.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >nicht gleichgewichtig sein</text>
<rect x="84" y="447" width="704" height="48" fill="#f7f3e4"/>
<text x="112" y="477.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 7</text>
<rect x="136" y="456.0" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="477.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >MK</text>
<text x="208" y="477.0" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Kerngebiet</text>
<text x="416" y="467.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >Handel, zentrale Einrichtungen von</text>
<text x="416" y="486.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >Wirtschaft, Verwaltung und Kultur</text>
<rect x="84" y="495" width="704" height="48" fill="#efe8cf"/>
<text x="112" y="525.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 8</text>
<rect x="136" y="504.0" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="525.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >GE</text>
<text x="208" y="525.0" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Gewerbegebiet</text>
<text x="416" y="515.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >vorwiegend nicht erheblich</text>
<text x="416" y="534.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >belästigendes Gewerbe</text>
<rect x="84" y="543" width="704" height="48" fill="#f7f3e4"/>
<text x="112" y="573.0" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 9</text>
<rect x="136" y="552.0" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="573.0" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >GI</text>
<text x="208" y="573.0" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Industriegebiet</text>
<text x="416" y="563.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >ausschließlich Gewerbe, vorwiegend</text>
<text x="416" y="582.5" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >das in anderen Gebieten unzulässige</text>
<rect x="84" y="603" width="704" height="52" rx="6" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="136" y="614" width="60" height="30" rx="4" fill="#f7f3e4" stroke="#414833" stroke-width="1.5"/>
<text x="166.0" y="635" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >SO</text>
<text x="208" y="625" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Sondergebiet (§§ 10, 11)</text>
<text x="208" y="645" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >eigene Zweckbestimmung im Plan, außerhalb der Reihe</text>
<rect x="14" y="56" width="60" height="176" rx="6" fill="#dde5b6" fill-opacity="0.7" stroke="#414833" stroke-width="1.2"/>
<text x="44.0" y="153.0" font-size="26" text-anchor="middle" font-weight="bold" fill="#414833" >W</text>
<rect x="14" y="240" width="60" height="251" rx="6" fill="#a98467" fill-opacity="0.7" stroke="#414833" stroke-width="1.2"/>
<text x="44.0" y="374.5" font-size="26" text-anchor="middle" font-weight="bold" fill="#414833" >M</text>
<rect x="14" y="499" width="60" height="88" rx="6" fill="#6c584c" fill-opacity="0.7" stroke="#414833" stroke-width="1.2"/>
<text x="44.0" y="552.0" font-size="26" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >G</text>
<rect x="14" y="607" width="60" height="44" rx="6" fill="#f7f3e4" fill-opacity="1" stroke="#414833" stroke-width="1.2" stroke-dasharray="6 4"/>
<text x="44.0" y="638.0" font-size="26" text-anchor="middle" font-weight="bold" fill="#414833" >S</text>
<text x="400" y="685" font-size="16" text-anchor="middle" font-weight="normal" fill="#6c584c" >Bauflächen W, M, G, S: § 1 Abs. 1 BauNVO (Flächennutzungsplan) · Baugebiete: § 1 Abs. 2</text>
</svg>
