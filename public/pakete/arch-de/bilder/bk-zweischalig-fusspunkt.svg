<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 700" width="820" height="700">
  <defs>
    <pattern id="fpMauer" width="34" height="17" patternUnits="userSpaceOnUse">
      <rect width="34" height="17" fill="#a98467"/>
      <path d="M0 0 H34 M0 8.5 H34 M0 17 H34" stroke="#8c6a53" stroke-width="1.2"/>
      <path d="M17 0 V8.5 M0 8.5 V17 M34 8.5 V17" stroke="#8c6a53" stroke-width="1.2"/>
    </pattern>
    <pattern id="fpDaemm" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#adc178"/>
      <path d="M-3 11 L11 -3 M0 14 L14 0 M3 17 L17 3" stroke="#8fa85f" stroke-width="1.4"/>
    </pattern>
    <pattern id="fpBeton" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#dde5b6"/>
      <circle cx="4" cy="5" r="1.6" fill="#a9b183"/>
      <circle cx="12" cy="11" r="1.3" fill="#a9b183"/>
    </pattern>
    <pattern id="fpErde" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#e4dcc0"/>
      <path d="M0 12 L12 0" stroke="#c3b894" stroke-width="1.2"/>
    </pattern>
    <pattern id="fpKies" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect width="18" height="18" fill="#f7f3e4"/>
      <circle cx="5" cy="6" r="3" fill="none" stroke="#a98467" stroke-width="1.3"/>
      <circle cx="13" cy="13" r="2.4" fill="none" stroke="#a98467" stroke-width="1.3"/>
    </pattern>
  </defs>

  <rect width="820" height="700" fill="#f0ead2"/>

  <!-- Erdreich und Kiesrigole -->
  <rect x="586" y="460" width="234" height="60" fill="url(#fpErde)"/>
  <rect x="700" y="460" width="88" height="58" fill="url(#fpKies)" stroke="#6c584c" stroke-width="1.6"/>
  <path d="M586 460 H820" stroke="#414833" stroke-width="2.4"/>

  <!-- Bodenplatte und Stahlbeton-Randstein -->
  <rect x="60"  y="400" width="297" height="56" fill="url(#fpBeton)" stroke="#414833" stroke-width="2"/>
  <rect x="357" y="400" width="243" height="60" fill="url(#fpBeton)" stroke="#414833" stroke-width="2"/>

  <!-- Wandschalen -->
  <rect x="200" y="46" width="157" height="344" fill="url(#fpMauer)" stroke="#414833" stroke-width="2"/>
  <rect x="357" y="46" width="126" height="340" fill="url(#fpDaemm)" stroke="#414833" stroke-width="2"/>
  <rect x="483" y="46" width="103" height="346" fill="url(#fpMauer)" stroke="#414833" stroke-width="2"/>

  <!-- offene Stossfuge -->
  <rect x="483" y="352" width="103" height="13" fill="#f0ead2" stroke="#414833" stroke-width="2"/>

  <!-- Abdichtung: an der Innenschale hochgefuehrt, Gefaelle nach aussen, bis Vorderkante Aussenschale -->
  <path d="M357 252 V388 L586 400" fill="none" stroke="#9a6b1f" stroke-width="5" stroke-linejoin="round"/>
  <path d="M200 392 H357" stroke="#9a6b1f" stroke-width="5"/>

  <!-- Drahtanker mit Tropfscheibe -->
  <path d="M320 200 H520" stroke="#414833" stroke-width="3.2"/>
  <path d="M320 195 v10 M520 195 v10" stroke="#414833" stroke-width="3.2"/>
  <ellipse cx="452" cy="200" rx="6.5" ry="14" fill="#f7f3e4" stroke="#414833" stroke-width="2.2"/>

  <!-- Weg des eingedrungenen Wassers -->
  <path d="M424 290 V370 L556 380" fill="none" stroke="#9a6b1f" stroke-width="2" stroke-dasharray="7 5"/>
  <path d="M562 381 l-14 -5 v10 z" fill="#9a6b1f"/>

  <!-- Masskette: Stossfuge ueber Gelaendeanschnitt -->
  <g stroke="#6c584c" stroke-width="1.4" fill="none">
    <path d="M628 365 V460"/>
    <path d="M620 365 h16 M620 460 h16"/>
  </g>
  <rect x="640" y="398" width="88" height="24" fill="#f0ead2"/>
  <text x="684" y="416" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#6c584c">≥ 100 mm</text>

  <!-- Masskette: Hochfuehrung an der Innenschale -->
  <g stroke="#6c584c" stroke-width="1.4" fill="none">
    <path d="M316 252 V388"/>
    <path d="M308 252 h16 M308 388 h16"/>
  </g>
  <rect x="272" y="308" width="88" height="24" fill="#f0ead2"/>
  <text x="316" y="326" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#6c584c">≥ 150 mm</text>

  <text x="96" y="110" font-family="Georgia, serif" font-size="19" fill="#6c584c">innen</text>
  <text x="700" y="110" font-family="Georgia, serif" font-size="19" fill="#6c584c">außen</text>

  <!-- Nummern -->
  <g font-family="Georgia, serif" font-size="16" font-weight="bold" text-anchor="middle">
    <g fill="#414833"><circle cx="534" cy="140" r="14" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="534" y="146">1</text></g>
    <g fill="#414833"><circle cx="420" cy="110" r="14" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="420" y="116">2</text></g>
    <g fill="#414833"><circle cx="266" cy="140" r="14" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="266" y="146">3</text></g>
    <g fill="#414833"><circle cx="452" cy="234" r="14" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="452" y="240">4</text></g>
    <g fill="#414833"><circle cx="534" cy="322" r="14" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="534" y="328">5</text></g>
    <g fill="#414833"><circle cx="452" cy="424" r="14" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="452" y="430">6</text></g>
    <g fill="#414833"><circle cx="252" cy="424" r="14" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="252" y="430">7</text></g>
    <g fill="#414833"><circle cx="744" cy="489" r="14" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="744" y="495">8</text></g>
  </g>
  <g stroke="#414833" stroke-width="1.3" fill="none">
    <path d="M534 154 V200"/>
    <path d="M420 124 V200"/>
    <path d="M266 154 V220"/>
    <path d="M452 220 V214"/>
    <path d="M534 336 V352"/>
    <path d="M452 410 L452 394"/>
    <path d="M252 410 V392"/>
  </g>

  <!-- Legende -->
  <path d="M60 540 H760" stroke="#d9d2b4" stroke-width="2"/>
  <g font-family="Georgia, serif" font-size="17" fill="#414833">
    <text x="60" y="572">1  Verblendschale, frostbeständig</text>
    <text x="60" y="600">2  Kerndämmung, wasserabweisend</text>
    <text x="60" y="628">3  tragende Innenschale</text>
    <text x="60" y="656">4  Drahtanker mit Tropfscheibe</text>
    <text x="470" y="572">5  offene Stoßfuge</text>
    <text x="470" y="600">6  Abdichtung, Gefälle nach außen</text>
    <text x="470" y="628">7  waagerechte Abdichtung</text>
    <text x="470" y="656">8  Kiesrigole</text>
  </g>
</svg>
