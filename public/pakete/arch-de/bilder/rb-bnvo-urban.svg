<text x="522" y="404" font-size="16" text-anchor="start" font-weight="bold" fill="#414833" >Erdgeschoss zur Straße:</text>
<text x="522" y="424" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >Wohnen nicht oder nur</text>
<text x="522" y="444" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >ausnahmsweise zulässig (Nr. 1)</text>
