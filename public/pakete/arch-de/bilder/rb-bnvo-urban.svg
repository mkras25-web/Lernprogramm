<text x="40" y="532" font-size="14" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >3</text>
<text x="62" y="522" font-size="16" text-anchor="start" font-weight="normal" fill="#414833" >Bestimmter Anteil oder bestimmte Größe der Geschossfläche für Wohnungen</text>
