<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="mwR" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="#a98467"/>
      <line x1="0" y1="11" x2="22" y2="11" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
      <line x1="11" y1="0" x2="11" y2="11" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
    </pattern>
    <pattern id="dmR" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#adc178"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="560" height="480" fill="#f0ead2"/>
  <text x="40" y="44" font-size="15" fill="#414833">innen</text>
  <text x="520" y="44" font-size="15" text-anchor="end" fill="#414833">außen</text>

  <rect x="90" y="60" width="16" height="200" fill="#dde5b6" stroke="#414833" stroke-width="1.4"/>
  <rect x="106" y="60" width="180" height="200" fill="url(#mwR)" stroke="#414833" stroke-width="1.4"/>
  <rect x="286" y="60" width="130" height="200" fill="url(#dmR)" stroke="#414833" stroke-width="1.4"/>
  <rect x="416" y="60" width="14" height="200" fill="#dde5b6" stroke="#414833" stroke-width="1.4"/>

  <g font-size="12" fill="#414833">
    <text x="98" y="278" text-anchor="middle">Putz</text>
    <text x="196" y="278" text-anchor="middle">Mauerwerk</text>
    <text x="351" y="278" text-anchor="middle">Dämmung</text>
    <text x="423" y="292" text-anchor="middle">Putz</text>
  </g>

  <text x="40" y="326" font-size="13" fill="#6c584c">s&#8346;-Wert nimmt nach außen ab</text>
  <g fill="#9a6b1f">
    <rect x="90" y="336" width="16" height="30" /><rect x="106" y="346" width="180" height="20" />
    <rect x="286" y="356" width="130" height="10" /><rect x="416" y="360" width="14" height="6" />
  </g>

  <text x="40" y="402" font-size="13" fill="#6c584c">R-Wert nimmt nach außen zu</text>
  <g fill="#adc178">
    <rect x="90" y="436" width="16" height="6" /><rect x="106" y="426" width="180" height="16" />
    <rect x="286" y="406" width="130" height="36" /><rect x="416" y="436" width="14" height="6" />
  </g>
</svg>
