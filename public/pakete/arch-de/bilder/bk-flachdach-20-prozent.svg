  <text x="60" y="364" font-family="Georgia, serif" font-size="22" font-weight="bold" text-anchor="start" fill="#414833">R unter der Sperre  ≤  0,20 · R gesamt</text>
  <text x="60" y="398" font-family="Georgia, serif" font-size="16" text-anchor="start" fill="#414833">Wird das eingehalten, gilt der Feuchteschutz nicht belüfteter Dächer mit</text>
  <text x="60" y="422" font-family="Georgia, serif" font-size="16" text-anchor="start" fill="#414833">Dachabdichtung als erbracht — zusammen mit s_d ≥ 100 m unter der Dämmung.</text>
  <text x="60" y="454" font-family="Georgia, serif" font-size="16" text-anchor="start" fill="#414833">Bei diffusionsdichter Dämmung auf starrem Untergrund kann die Sperre entfallen.</text>
