  <text x="300" y="209" font-family="Georgia, serif" font-size="15" text-anchor="start" fill="#414833">Dämmung: Extruderschaum</text>
  <text x="300" y="251" font-family="Georgia, serif" font-size="15" text-anchor="start" fill="#414833">Abdichtung auf der Decke</text>
