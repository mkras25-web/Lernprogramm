  <text x="50" y="348" font-family="Georgia, serif" font-size="15" text-anchor="start" fill="#414833">Die Dämmung liegt über der Abdichtung im Nassen.</text>
  <text x="50" y="372" font-family="Georgia, serif" font-size="15" text-anchor="start" fill="#414833">Sie schützt sie und muss durchfeuchtungshemmend sein.</text>
