<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="760" height="450">
<defs>
<pattern id="mw" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="14" height="14" fill="#a98467"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#6c584c" stroke-width="1.1" opacity="0.55"/>
</pattern>
<pattern id="dm" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#adc178"/>
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f7f3e4" stroke-width="2" opacity="0.7"/>
</pattern>
<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#dde5b6"/>
  <line x1="0" y1="0" x2="9" y2="9" stroke="#6c584c" stroke-width="0.9" opacity="0.5"/>
</pattern>
<pattern id="bt" width="12" height="12" patternUnits="userSpaceOnUse">
  <rect width="12" height="12" fill="#d9d2b4"/>
  <circle cx="3" cy="4" r="1.4" fill="#6c584c" opacity="0.5"/>
  <circle cx="9" cy="9" r="1.1" fill="#6c584c" opacity="0.5"/>
</pattern>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a6b1f"/></marker>
<marker id="pfk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6c584c"/></marker>
</defs>
<rect x="0" y="0" width="760" height="450" fill="#f0ead2"/>
<text x="380.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Vierseitig oder dreiseitig</text>
<text x="380.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Ansicht — wo der Rahmen am Boden aufhört, beginnt die Schwelle</text>
<rect x="30" y="78" width="290" height="242" fill="url(#mw)" stroke="#414833" stroke-width="1.6"/>
<rect x="60" y="96" width="230" height="224" fill="#f7f3e4" stroke="#414833" stroke-width="1.4"/>
<rect x="60" y="96" width="230" height="18" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<rect x="60" y="96" width="18" height="224" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<rect x="272" y="96" width="18" height="224" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<rect x="60" y="302" width="230" height="18" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<text x="175.0" y="208.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Öffnung</text>
<text x="30" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">Fensterzarge</text>
<text x="30" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Die Fensterzarge läuft vierseitig um.</text>
<rect x="400" y="78" width="290" height="242" fill="url(#mw)" stroke="#414833" stroke-width="1.6"/>
<rect x="430" y="96" width="230" height="224" fill="#f7f3e4" stroke="#414833" stroke-width="1.4"/>
<rect x="430" y="96" width="230" height="18" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<rect x="430" y="96" width="18" height="224" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<rect x="642" y="96" width="18" height="224" fill="#dde5b6" stroke="#414833" stroke-width="1.8"/>
<rect x="422" y="312" width="246" height="12" fill="#9a6b1f" stroke="#414833" stroke-width="1.6"/>
<text x="394" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="end" fill="#9a6b1f" font-weight="bold" font-style="normal">Schwelle</text>
<text x="545.0" y="208.0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Öffnung</text>
<text x="400" y="358" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">Türzarge</text>
<text x="400" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Die Türzarge bildet einen dreiseitigen</text>
<text x="400" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Rahmen: oben, links, rechts.</text>
<line x1="56" y1="412" x2="704" y2="412" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="56" y="434" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a6b1f" font-weight="normal" font-style="italic">Dasselbe gilt für den Blendrahmen bodentiefer Öffnungen: Er läuft nur dreiseitig um.</text>
</svg>