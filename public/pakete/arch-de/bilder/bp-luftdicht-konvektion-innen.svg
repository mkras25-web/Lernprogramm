<rect x="0" y="0" width="470" height="430" fill="#f0ead2"/>
<text x="235.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Strömung B</text>
<text x="235.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Undichte Fuge in der Außenwand, Winterfall</text>
<rect x="150" y="100" width="170" height="96" fill="url(#mw)" stroke="#414833" stroke-width="2"/>
<rect x="150" y="246" width="170" height="102" fill="url(#mw)" stroke="#414833" stroke-width="2"/>
<rect x="150" y="196" width="170" height="50" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="30" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#6c584c" font-weight="bold" font-style="normal">außen</text>
<text x="440" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="end" fill="#6c584c" font-weight="bold" font-style="normal">innen</text>
<text x="30" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#6c584c" font-weight="normal" font-style="normal">−5 °C</text>
<text x="440" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="end" fill="#6c584c" font-weight="normal" font-style="normal">20 °C / 50 %</text>
<text x="235" y="238" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">undichte Fuge</text>
<line x1="74" y1="214" x2="384" y2="214" stroke="#6c584c" stroke-width="3.2" marker-end="url(#pfk)"/>
<rect x="176.5" y="160" width="117.00000000000001" height="22" rx="5" fill="#f7f3e4" opacity="0.94"/><text x="235" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#6c584c" font-weight="bold" font-style="normal">kalte Außenluft</text>
<path d="M344,262 q14,11 28,0 q14,-11 28,0" fill="none" stroke="#9a6b1f" stroke-width="2.4"/>
<path d="M348,280 q14,11 28,0 q14,-11 28,0" fill="none" stroke="#9a6b1f" stroke-width="2.4"/>
<path d="M352,298 q14,11 28,0 q14,-11 28,0" fill="none" stroke="#9a6b1f" stroke-width="2.4"/>
<rect x="323.5" y="318" width="117.00000000000001" height="22" rx="5" fill="#f7f3e4" opacity="0.94"/><text x="382" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#9a6b1f" font-weight="bold" font-style="normal">Zugluft im Raum</text>
<text x="28" y="368" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Die Luft erwärmt sich auf dem Weg nach innen.</text>
<text x="28" y="385" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">In der Konstruktion entsteht dabei kein Tau-</text>
<text x="28" y="402" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">wasser — wohl aber unerwünschte Zugluft</text>
<text x="28" y="419" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">und ein Verlust an Behaglichkeit.</text>
</svg>