<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="dmw" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#adc178"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#6c584c" stroke-width="1" opacity="0.45"/>
    </pattern>
    <pattern id="beton" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#a98467"/>
      <circle cx="4" cy="5" r="1.3" fill="#6c584c" opacity="0.6"/>
      <circle cx="10" cy="10" r="1.1" fill="#6c584c" opacity="0.6"/>
    </pattern>
    <marker id="pf2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6c584c"/>
    </marker>
  </defs>

  <rect width="980" height="520" fill="#f0ead2"/>

  <rect x="200" y="60" width="100" height="380" fill="url(#beton)" stroke="#414833" stroke-width="1.5"/>
  <rect x="300" y="60" width="40" height="380" fill="url(#dmw)" stroke="#414833" stroke-width="1.5"/>
  <rect x="40" y="230" width="520" height="40" fill="url(#beton)" stroke="#414833" stroke-width="1.5"/>

  <g fill="none" stroke="#6c584c" stroke-width="2" stroke-dasharray="6 4" opacity="0.9">
    <path d="M230,70 C230,175 200,215 200,250 C200,285 230,325 230,430"/>
    <path d="M270,70 C270,180 240,222 240,250 C240,278 270,320 270,430"/>
    <path d="M312,70 C312,190 286,230 286,250 C286,270 312,310 312,430"/>
  </g>

  <g stroke="#6c584c" stroke-width="2.5" marker-end="url(#pf2)">
    <line x1="150" y1="140" x2="352" y2="140"/>
    <line x1="150" y1="250" x2="600" y2="250"/>
  </g>

  <g font-size="15" fill="#414833">
    <text x="60" y="100" font-size="17" font-weight="600">innen</text>
    <text x="880" y="100" font-size="17" font-weight="600">außen</text>
    <text x="380" y="144" fill="#6c584c">Wärmestrom im ungestörten Bereich</text>
    <text x="380" y="200" font-weight="600">ungestörter Bauteilbereich –</text>
    <text x="380" y="222" font-weight="600">hier gilt der U-Wert</text>
    <text x="618" y="244" fill="#6c584c">zusätzlicher</text>
    <text x="618" y="264" fill="#6c584c">Wärmestrom &#968;</text>
    <text x="380" y="320" font-weight="600">Wärmebrücke: die Platte</text>
    <text x="380" y="342" font-weight="600">durchstößt die Dämmebene</text>
    <text x="380" y="366" fill="#6c584c">Verlust längenbezogen in W/(m·K),</text>
    <text x="380" y="386" fill="#6c584c">nicht je m²</text>
    <text x="380" y="440" fill="#6c584c">Isothermen – Linien gleicher Temperatur</text>
    <line x1="374" y1="435" x2="318" y2="410" stroke="#6c584c" stroke-width="1.2"/>
    <text x="46" y="330">abgekühlte</text>
    <text x="46" y="350">Innenoberfläche</text>
    <line x1="150" y1="322" x2="196" y2="276" stroke="#414833" stroke-width="1.2"/>
  </g>
</svg>
