<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 690" width="780" height="690">
<defs>
<pattern id="mw" width="14" height="14" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="14" height="14" fill="#a98467"/>
  <line x1="0" y1="0" x2="0" y2="14" stroke="#6c584c" stroke-width="1.1" opacity="0.55"/>
</pattern>
<pattern id="dm" width="10" height="10" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
  <rect width="10" height="10" fill="#adc178"/>
  <line x1="0" y1="0" x2="0" y2="10" stroke="#f7f3e4" stroke-width="2" opacity="0.7"/>
</pattern>
<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse">
  <rect width="9" height="9" fill="#dde5b6"/>
  <line x1="0" y1="0" x2="9" y2="9" stroke="#6c584c" stroke-width="0.9" opacity="0.5"/>
</pattern>
<pattern id="bt" width="12" height="12" patternUnits="userSpaceOnUse">
  <rect width="12" height="12" fill="#d9d2b4"/>
  <circle cx="3" cy="4" r="1.4" fill="#6c584c" opacity="0.5"/>
  <circle cx="9" cy="9" r="1.1" fill="#6c584c" opacity="0.5"/>
</pattern>
<marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#9a6b1f"/></marker>
<marker id="pfk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6"
        orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#6c584c"/></marker>
</defs>
<rect x="0" y="0" width="780" height="690" fill="#f0ead2"/>
<text x="390.0" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="19" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">Kräfte an einem Öffnungselement</text>
<text x="390.0" y="56" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#6c584c" font-weight="normal" font-style="normal">Ansicht mit geöffnetem Flügel — Prinzipskizze</text>
<rect x="120" y="100" width="440" height="340" fill="url(#mw)" stroke="#414833" stroke-width="1.8"/>
<rect x="180" y="130" width="320" height="280" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<rect x="180" y="130" width="320" height="18" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<rect x="180" y="392" width="320" height="18" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<rect x="180" y="130" width="18" height="280" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<rect x="482" y="130" width="18" height="280" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<path d="M482,148 L644,190 L644,372 L482,392 Z" fill="url(#hz)" stroke="#414833" stroke-width="2"/>
<rect x="198" y="374" width="48" height="18" fill="#adc178" stroke="#414833" stroke-width="2"/>
<rect x="434" y="374" width="48" height="18" fill="#adc178" stroke="#414833" stroke-width="2"/>
<rect x="198" y="240" width="18" height="48" fill="#adc178" stroke="#414833" stroke-width="2"/>
<line x1="300" y1="160" x2="300" y2="232" stroke="#9a6b1f" stroke-width="2.6" marker-end="url(#pf)"/>
<line x1="570" y1="210" x2="570" y2="292" stroke="#9a6b1f" stroke-width="2.6" marker-end="url(#pf)"/>
<line x1="62" y1="320" x2="158" y2="320" stroke="#9a6b1f" stroke-width="2.6" marker-end="url(#pf)"/>
<line x1="392" y1="350" x2="302" y2="350" stroke="#9a6b1f" stroke-width="2.6" marker-end="url(#pf)"/>
<circle cx="262" cy="196" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="262" y="201" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">1</text>
<circle cx="604" cy="250" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="604" y="255" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">2</text>
<circle cx="98" cy="288" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="98" y="293" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">3</text>
<circle cx="348" cy="320" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="348" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">4</text>
<circle cx="222" cy="383" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="222" y="388" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">5</text>
<circle cx="207" cy="264" r="13" fill="#f7f3e4" stroke="#414833" stroke-width="2"/><text x="207" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#414833" font-weight="bold" font-style="normal">6</text>
<line x1="44" y1="508" x2="736" y2="508" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="50" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">1</text>
<text x="72" y="536" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Eigenlast des Flügels, vertikal in der Elementebene</text>
<text x="50" y="557" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">2</text>
<text x="72" y="557" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">vertikale Nutzlast am geöffneten Flügel: 200, 400, 600 oder 800 N</text>
<text x="50" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">3</text>
<text x="72" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Windlast als Druck und Sog, rechtwinklig zur Elementebene</text>
<text x="50" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">4</text>
<text x="72" y="599" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">horizontale Nutzlast bei Elementen bis unter Brüstungshöhe</text>
<text x="50" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">5</text>
<text x="72" y="620" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Tragklotz — nimmt nur Druck auf und ist gegen Verrutschen gesichert</text>
<text x="50" y="641" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="bold" font-style="normal">6</text>
<text x="72" y="641" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#414833" font-weight="normal" font-style="normal">Distanzklotz — nimmt Kräfte horizontal in der Elementebene auf</text>
<text x="50" y="676" font-family="Segoe UI, Arial, sans-serif" font-size="13" text-anchor="start" fill="#9a6b1f" font-weight="normal" font-style="italic">Eine Überlagerung der Kräfte aus Eigengewicht, Wind und Nutzlast ist nicht erforderlich.</text>
</svg>