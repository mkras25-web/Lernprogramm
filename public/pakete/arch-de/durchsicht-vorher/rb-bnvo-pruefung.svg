<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 530" width="800" height="530" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="530" fill="#f0ead2"/>
<rect x="60" y="30" width="500" height="70" rx="6" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<circle cx="90" cy="65.0" r="15" fill="#414833" stroke="#f7f3e4" stroke-width="2"/>
<text x="90" y="70.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >1</text>
<text x="118" y="60" font-size="17" text-anchor="start" font-weight="bold" fill="#414833" >Welches Baugebiet ist festgesetzt?</text>
<text x="118" y="83" font-size="13.5" text-anchor="start" font-weight="normal" fill="#6c584c" >§§ 2–14 BauNVO werden Bestandteil des Plans (§ 1 Abs. 3)</text>
<line x1="310.0" y1="100" x2="310.0" y2="121" stroke="#414833" stroke-width="2.5"/>
<polygon points="303.0,119 317.0,119 310.0,130" fill="#414833"/>
<rect x="60" y="130" width="500" height="70" rx="6" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<circle cx="90" cy="165.0" r="15" fill="#414833" stroke="#f7f3e4" stroke-width="2"/>
<text x="90" y="170.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >2</text>
<text x="118" y="160" font-size="17" text-anchor="start" font-weight="bold" fill="#414833" >Hat der Plan den Katalog abgewandelt?</text>
<text x="118" y="183" font-size="13.5" text-anchor="start" font-weight="normal" fill="#6c584c" >Gliederung, Ausschlüsse, geschossweise Regeln (§ 1 Abs. 4–10)</text>
<line x1="310.0" y1="200" x2="310.0" y2="221" stroke="#414833" stroke-width="2.5"/>
<polygon points="303.0,219 317.0,219 310.0,230" fill="#414833"/>
<rect x="60" y="230" width="500" height="70" rx="6" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<circle cx="90" cy="265.0" r="15" fill="#414833" stroke="#f7f3e4" stroke-width="2"/>
<text x="90" y="270.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >3</text>
<text x="118" y="260" font-size="17" text-anchor="start" font-weight="bold" fill="#414833" >Allgemein zulässig nach Absatz 2?</text>
<text x="118" y="283" font-size="13.5" text-anchor="start" font-weight="normal" fill="#6c584c" >ja: Anspruch auf Zulassung – weiter mit 5</text>
<line x1="310.0" y1="300" x2="310.0" y2="321" stroke="#414833" stroke-width="2.5"/>
<polygon points="303.0,319 317.0,319 310.0,330" fill="#414833"/>
<rect x="60" y="330" width="500" height="70" rx="6" fill="#dde5b6" stroke="#414833" stroke-width="1.6"/>
<circle cx="90" cy="365.0" r="15" fill="#414833" stroke="#f7f3e4" stroke-width="2"/>
<text x="90" y="370.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >4</text>
<text x="118" y="360" font-size="17" text-anchor="start" font-weight="bold" fill="#414833" >Falls nicht: ausnahmsweise nach Absatz 3?</text>
<text x="118" y="383" font-size="13.5" text-anchor="start" font-weight="normal" fill="#6c584c" >ja: Ausnahme nach § 31 Abs. 1 BauGB, Ermessen</text>
<line x1="310.0" y1="400" x2="310.0" y2="421" stroke="#414833" stroke-width="2.5"/>
<polygon points="303.0,419 317.0,419 310.0,430" fill="#414833"/>
<rect x="60" y="430" width="500" height="70" rx="6" fill="#adc178" stroke="#414833" stroke-width="1.6"/>
<circle cx="90" cy="465.0" r="15" fill="#414833" stroke="#f7f3e4" stroke-width="2"/>
<text x="90" y="470.0" font-size="15" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >5</text>
<text x="118" y="460" font-size="17" text-anchor="start" font-weight="bold" fill="#414833" >Einzelfallprüfung nach § 15 Abs. 1</text>
<text x="118" y="483" font-size="13.5" text-anchor="start" font-weight="normal" fill="#6c584c" >Widerspruch zur Eigenart? Unzumutbare Störungen?</text>
<line x1="560" y1="365.0" x2="600" y2="365.0" stroke="#9a6b1f" stroke-width="2.5"/>
<polygon points="598,358.0 598,372.0 610,365.0" fill="#9a6b1f"/>
<rect x="612" y="319.0" width="168" height="92" rx="6" fill="#f7f3e4" stroke="#9a6b1f" stroke-width="2"/>
<text x="696" y="345.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >nein:</text>
<text x="696" y="365.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#9a6b1f" >unzulässig</text>
<text x="696" y="385.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#6c584c" >allenfalls Befreiung</text>
<text x="696" y="401.0" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#6c584c" >(§ 31 Abs. 2 BauGB)</text>
</svg>
