<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 545" width="800" height="545" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="545" fill="#f0ead2"/>
<text x="400" y="32" font-size="19" text-anchor="middle" font-weight="bold" fill="#414833" >Die am Bau Beteiligten (§§ 55–59 HBO)</text>
<rect x="200" y="56" width="300" height="64" rx="8" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="350" y="84" font-size="18" text-anchor="middle" font-weight="bold" fill="#414833" >Bauherrschaft</text>
<text x="350" y="106" font-size="14" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 56</text>
<rect x="600" y="56" width="180" height="64" rx="8" fill="#a98467" stroke="#414833" stroke-width="2"/>
<text x="690" y="84" font-size="17" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >Bauaufsicht</text>
<text x="690" y="106" font-size="14" text-anchor="middle" font-weight="normal" fill="#f7f3e4" >§§ 60, 61</text>
<line x1="500" y1="88" x2="598" y2="88" stroke="#414833" stroke-width="2.2"/>
<polygon points="598,88 586,82 586,94" fill="#414833"/>
<text x="549" y="78" font-size="12" text-anchor="middle" font-weight="normal" fill="#6c584c" >Anträge,</text>
<text x="549" y="108" font-size="12" text-anchor="middle" font-weight="normal" fill="#6c584c" >Anzeigen</text>
<line x1="350" y1="120" x2="107" y2="210" stroke="#414833" stroke-width="2"/>
<rect x="20" y="210" width="175" height="96" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="107" y="240" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >Entwurfs-</text>
<text x="107" y="260" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >verfassende</text>
<text x="107" y="290" font-size="14" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 57</text>
<line x1="107" y1="306" x2="107" y2="336" stroke="#6c584c" stroke-width="1.8" stroke-dasharray="5 4"/>
<rect x="30" y="336" width="155" height="48" rx="8" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5"/>
<text x="107" y="365" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >Fachplanende</text>
<line x1="350" y1="120" x2="302" y2="210" stroke="#414833" stroke-width="2"/>
<rect x="215" y="210" width="175" height="96" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="302" y="240" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >Unter-</text>
<text x="302" y="260" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >nehmen</text>
<text x="302" y="290" font-size="14" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 58</text>
<line x1="302" y1="306" x2="302" y2="336" stroke="#6c584c" stroke-width="1.8" stroke-dasharray="5 4"/>
<rect x="225" y="336" width="155" height="48" rx="8" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5"/>
<text x="302" y="365" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >Fachunternehmen</text>
<line x1="350" y1="120" x2="497" y2="210" stroke="#414833" stroke-width="2"/>
<rect x="410" y="210" width="175" height="96" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="497" y="240" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >Bau-</text>
<text x="497" y="260" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >leitung</text>
<text x="497" y="290" font-size="14" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 59</text>
<line x1="497" y1="306" x2="497" y2="336" stroke="#6c584c" stroke-width="1.8" stroke-dasharray="5 4"/>
<rect x="420" y="336" width="155" height="48" rx="8" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5"/>
<text x="497" y="365" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >Fachbauleitung</text>
<line x1="350" y1="120" x2="692" y2="210" stroke="#414833" stroke-width="2"/>
<rect x="605" y="210" width="175" height="96" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="692" y="240" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >Nachweis-</text>
<text x="692" y="260" font-size="16" text-anchor="middle" font-weight="bold" fill="#414833" >berechtigte</text>
<text x="692" y="290" font-size="14" text-anchor="middle" font-weight="normal" fill="#6c584c" >§ 68</text>
<line x1="692" y1="306" x2="692" y2="336" stroke="#6c584c" stroke-width="1.8" stroke-dasharray="5 4"/>
<rect x="615" y="336" width="155" height="48" rx="8" fill="#f7f3e4" stroke="#6c584c" stroke-width="1.5"/>
<text x="692" y="365" font-size="14" text-anchor="middle" font-weight="normal" fill="#414833" >Prüfsachverständige</text>
<text x="395" y="200" font-size="14" text-anchor="middle" font-weight="bold" fill="#6c584c" >beauftragt</text>
<line x1="20" y1="414" x2="780" y2="414" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="40" y="442" font-size="15" text-anchor="start" font-weight="normal" fill="#414833" >§ 55: Jede und jeder ist im eigenen Aufgabenbereich für die Einhaltung</text>
<text x="40" y="466" font-size="15" text-anchor="start" font-weight="normal" fill="#414833" >der öffentlich-rechtlichen Vorschriften verantwortlich – die Bauherrschaft zuerst.</text>
<text x="40" y="496" font-size="15" text-anchor="start" font-weight="normal" fill="#6c584c" >Wer einem Teilgebiet nicht gewachsen ist, zieht Fachleute hinzu und bleibt</text>
<text x="40" y="520" font-size="15" text-anchor="start" font-weight="normal" fill="#6c584c" >für das Zusammenwirken verantwortlich.</text>
</svg>
