<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 546" width="800" height="546" font-family="Arial, Helvetica, 'Liberation Sans', sans-serif">
<rect x="0" y="0" width="800" height="546" fill="#f0ead2"/>
<defs><marker id="spitze" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12 Z" fill="#414833"/></marker></defs>
<text x="400" y="32" font-size="19" text-anchor="middle" font-weight="bold" fill="#414833" >Planerhaltung: Wann führt ein Fehler zur Unwirksamkeit?</text>
<rect x="250" y="50" width="300" height="46" rx="8" fill="#a98467" stroke="#414833" stroke-width="2"/>
<text x="400" y="79" font-size="17" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >Fehler im Bauleitplan</text>
<line x1="400" y1="96" x2="400" y2="122" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/>
<rect x="40" y="124" width="440" height="62" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="260" y="150" font-size="15" text-anchor="middle" font-weight="normal" fill="#414833" >Nach § 214 Abs. 1–3 BauGB</text>
<text x="260" y="170" font-size="15" text-anchor="middle" font-weight="normal" fill="#414833" >überhaupt beachtlich?</text>
<line x1="480" y1="155" x2="548" y2="155" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/><text x="494" y="147" font-size="14" text-anchor="start" font-weight="bold" fill="#6c584c" >nein</text>
<rect x="550" y="124" width="220" height="62" rx="8" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="660" y="150" font-size="14" text-anchor="middle" font-weight="bold" fill="#414833" >unbeachtlich –</text>
<text x="660" y="169" font-size="14" text-anchor="middle" font-weight="bold" fill="#414833" >Plan bleibt wirksam</text>
<line x1="260" y1="186" x2="260" y2="216" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/><text x="270" y="207" font-size="14" text-anchor="start" font-weight="bold" fill="#6c584c" >ja</text>
<rect x="40" y="218" width="440" height="62" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="260" y="244" font-size="15" text-anchor="middle" font-weight="normal" fill="#414833" >Rügepflichtig und nicht binnen eines</text>
<text x="260" y="264" font-size="15" text-anchor="middle" font-weight="normal" fill="#414833" >Jahres schriftlich gerügt (§ 215)?</text>
<line x1="480" y1="249" x2="548" y2="249" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/><text x="494" y="241" font-size="14" text-anchor="start" font-weight="bold" fill="#6c584c" >ja</text>
<rect x="550" y="218" width="220" height="62" rx="8" fill="#dde5b6" stroke="#414833" stroke-width="2"/>
<text x="660" y="244" font-size="14" text-anchor="middle" font-weight="bold" fill="#414833" >unbeachtlich</text>
<text x="660" y="263" font-size="14" text-anchor="middle" font-weight="bold" fill="#414833" >geworden</text>
<line x1="260" y1="280" x2="260" y2="310" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/><text x="270" y="301" font-size="14" text-anchor="start" font-weight="bold" fill="#6c584c" >nein</text>
<rect x="40" y="312" width="440" height="62" rx="8" fill="#f7f3e4" stroke="#414833" stroke-width="2"/>
<text x="260" y="338" font-size="15" text-anchor="middle" font-weight="normal" fill="#414833" >Im ergänzenden Verfahren</text>
<text x="260" y="358" font-size="15" text-anchor="middle" font-weight="normal" fill="#414833" >behebbar (§ 214 Abs. 4)?</text>
<line x1="480" y1="343" x2="548" y2="343" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/><text x="494" y="335" font-size="14" text-anchor="start" font-weight="bold" fill="#6c584c" >ja</text>
<rect x="550" y="312" width="220" height="62" rx="8" fill="#adc178" stroke="#414833" stroke-width="2"/>
<text x="660" y="338" font-size="14" text-anchor="middle" font-weight="bold" fill="#414833" >beheben, Plan rückwirkend</text>
<text x="660" y="357" font-size="14" text-anchor="middle" font-weight="bold" fill="#414833" >in Kraft setzen</text>
<line x1="260" y1="374" x2="260" y2="404" stroke="#414833" stroke-width="2.2" marker-end="url(#spitze)"/><text x="270" y="395" font-size="14" text-anchor="start" font-weight="bold" fill="#6c584c" >nein</text>
<rect x="40" y="406" width="730" height="50" rx="8" fill="#9a6b1f" stroke="#414833" stroke-width="2"/>
<text x="405" y="438" font-size="17" text-anchor="middle" font-weight="bold" fill="#f7f3e4" >Plan unwirksam – ganz oder teilweise</text>
<line x1="20" y1="480" x2="780" y2="480" stroke="#d9d2b4" stroke-width="1.5"/>
<text x="40" y="506" font-size="14" text-anchor="start" font-weight="normal" fill="#414833" >Keine Rügefrist für: fehlenden Beschluss, fehlende Genehmigung,</text>
<text x="40" y="528" font-size="14" text-anchor="start" font-weight="normal" fill="#414833" >verfehlten Hinweiszweck der Bekanntmachung und Mängel im Abwägungsergebnis.</text>
</svg>
