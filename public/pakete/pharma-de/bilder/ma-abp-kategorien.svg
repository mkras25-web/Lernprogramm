<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3439"/></marker>
  </defs>
  <rect width="900" height="660" fill="#eef2f3"/>
  <rect x="40" y="100" width="400" height="196" rx="8" fill="#f8fafb" stroke="#d7e0e2" stroke-width="2"/>
  <rect x="40" y="100" width="7" height="196" rx="3" fill="#c8873a"/>
  <rect x="460" y="100" width="400" height="148" rx="8" fill="#f8fafb" stroke="#d7e0e2" stroke-width="2"/>
  <rect x="460" y="100" width="7" height="148" rx="3" fill="#d9a679"/>
  <rect x="460" y="268" width="400" height="100" rx="8" fill="#f8fafb" stroke="#d7e0e2" stroke-width="2"/>
  <rect x="460" y="268" width="7" height="100" rx="3" fill="#2f7d8a"/>
  <rect x="40" y="316" width="190" height="76" rx="8" fill="#f8fafb" stroke="#d7e0e2" stroke-width="2"/>
  <rect x="40" y="316" width="7" height="76" rx="3" fill="#3f7d5a"/>
  <rect x="250" y="316" width="190" height="76" rx="8" fill="#f8fafb" stroke="#d7e0e2" stroke-width="2"/>
  <rect x="250" y="316" width="7" height="76" rx="3" fill="#b03a2e"/>
  <rect x="40" y="412" width="820" height="144" rx="8" fill="#f8fafb" stroke="#d7e0e2" stroke-width="2"/>
  <rect x="40" y="412" width="7" height="144" rx="3" fill="#587681"/>
    <text x="24" y="40" font-size="18" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Arzneimittelbezogene Probleme: sechs Kategorien</text>
    <text x="24" y="64" font-size="13" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Die Systematik, nach der ein ABP im Medikationsbrief benannt wird.</text>
    <text x="64" y="128" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Arzneimittelauswahl</text>
    <text x="420" y="128" font-size="12" fill="#c8873a" text-anchor="end" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">6 Arten</text>
    <text x="64" y="156" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Arzneimittel ohne Indikation</text>
    <text x="64" y="178" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Indikation ohne Arzneimittel</text>
    <text x="64" y="200" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Zu viele Arzneimittel für eine Indikation</text>
    <text x="64" y="222" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Kontraindikation</text>
    <text x="64" y="244" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· ungeeignetes Arzneimittel</text>
    <text x="64" y="266" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· abweichende Arzneimittelstärke</text>
    <text x="484" y="128" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Dosierung und Therapiedauer</text>
    <text x="840" y="128" font-size="12" fill="#d9a679" text-anchor="end" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">4 Arten</text>
    <text x="484" y="156" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Ungeeignete Dosis</text>
    <text x="484" y="178" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Ungeeignetes Dosierungsintervall</text>
    <text x="484" y="200" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Ungeeigneter Einnahmezeitpunkt</text>
    <text x="484" y="222" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Ungeeignete Therapiedauer</text>
    <text x="484" y="296" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Interaktionen</text>
    <text x="840" y="296" font-size="12" fill="#2f7d8a" text-anchor="end" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">2 Arten</text>
    <text x="484" y="324" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Interaktionen in der Medikation</text>
    <text x="484" y="346" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Symptome aufgrund einer Interaktion</text>
    <text x="64" y="344" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Darreichungsform</text>
    <text x="274" y="344" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Unerwünschte Arznei-</text>
    <text x="274" y="364" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">mittelwirkung</text>
    <text x="64" y="440" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Patientenbezug</text>
    <text x="840" y="440" font-size="12" fill="#587681" text-anchor="end" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">11 Arten</text>
    <text x="64" y="468" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· falsche Anwendung · Missbrauch · Handhabung</text>
    <text x="64" y="490" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Dosis nicht eingehalten · Zeitpunkt selbst gewählt</text>
    <text x="64" y="512" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· Anweisungen nicht verstanden · Angst vor Therapie</text>
    <text x="64" y="534" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">· unsachgemäße Lagerung · Fragen zur Therapie</text>
    <text x="24" y="598" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Patientenbezogene Probleme wurden von beiden Berufsgruppen als weniger relevant für den Brief eingestuft</text>
    <text x="24" y="620" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">als die übrigen Kategorien – sie sind oft im Patientengespräch zu lösen.</text>
</svg>
