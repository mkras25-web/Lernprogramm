    <text x="24" y="40" font-size="18" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Von der Analyse zur versendeten Nachricht</text>
    <text x="24" y="64" font-size="13" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Fünf Schritte. Die Auswahl der ABP steht am Anfang, nicht beim Schreiben.</text>
    <text x="52" y="143" font-size="15" fill="#f8fafb" text-anchor="middle" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">I</text>
    <text x="112" y="130" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Medikationsanalyse</text>
    <text x="112" y="152" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">ABP nach Relevanz und Handlungsbedarf auswählen · Medikationsplan aktualisieren</text>
    <text x="52" y="225" font-size="15" fill="#f8fafb" text-anchor="middle" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">II</text>
    <text x="112" y="212" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Kommunikationsweg wählen</text>
    <text x="112" y="234" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Dringendes telefonisch · Relevante ABP schriftlich</text>
    <text x="52" y="307" font-size="15" fill="#f8fafb" text-anchor="middle" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">III</text>
    <text x="112" y="294" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Medikationsbrief befüllen</text>
    <text x="112" y="316" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">Problem, Ursache und Lösungsvorschlag je ABP</text>
    <text x="52" y="389" font-size="15" fill="#f8fafb" text-anchor="middle" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">IV</text>
    <text x="112" y="376" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Medikationsplan anhängen</text>
    <text x="112" y="398" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">aktualisierte Fassung</text>
    <text x="52" y="471" font-size="15" fill="#f8fafb" text-anchor="middle" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">V</text>
    <text x="112" y="458" font-size="14.5" fill="#1f3439" text-anchor="start" font-weight="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">Prüfen und versenden</text>
    <text x="112" y="480" font-size="12.5" fill="#587681" text-anchor="start" font-weight="normal" font-family="Segoe UI, Helvetica, Arial, sans-serif">PDF prüfen und speichern · als Anhang einer KIM-Nachricht</text>
