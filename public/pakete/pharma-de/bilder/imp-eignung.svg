<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 610" width="940" height="610">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3439"/></marker>
  </defs>
  <rect width="940" height="610" fill="#eef2f3"/>
  <g>
  <rect x="330" y="52" width="280" height="58" rx="10" fill="#2f7d8a" stroke="#2f7d8a" stroke-width="2"/>
  <rect x="30" y="210" width="260" height="282" rx="10" fill="#f8fafb" stroke="#d7e0e2" stroke-width="2"/>
  <rect x="30" y="210" width="260" height="62" rx="10" fill="#b03a2e"/>
  <rect x="30" y="254" width="260" height="18" fill="#b03a2e"/>
  <path d="M160 128 L160 200" stroke="#b03a2e" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="340" y="210" width="260" height="282" rx="10" fill="#f8fafb" stroke="#d7e0e2" stroke-width="2"/>
  <rect x="340" y="210" width="260" height="62" rx="10" fill="#c8873a"/>
  <rect x="340" y="254" width="260" height="18" fill="#c8873a"/>
  <path d="M470 128 L470 200" stroke="#c8873a" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="650" y="210" width="260" height="282" rx="10" fill="#f8fafb" stroke="#d7e0e2" stroke-width="2"/>
