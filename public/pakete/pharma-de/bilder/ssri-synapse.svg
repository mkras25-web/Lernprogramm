<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 730" width="880" height="730">
  <defs>
    <marker id="sp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3439"/>
    </marker>
    <marker id="spr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/>
    </marker>
    <marker id="spt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d8a"/>
    </marker>
  </defs>

  <rect width="880" height="730" fill="#eef2f3"/>

  <rect x="120" y="275" width="640" height="85" fill="#f8fafb"/>

  <path d="M120,275 L120,95 Q120,60 155,60 L565,60 Q600,60 600,95 L600,275 Z" fill="#cfe0e3" stroke="#587681" stroke-width="2.5"/>
  <path d="M120,360 L760,360 L760,540 Q760,575 725,575 L155,575 Q120,575 120,540 Z" fill="#cfe0e3" stroke="#587681" stroke-width="2.5"/>

  <!-- Mitochondrium mit MAO -->
  <ellipse cx="196" cy="132" rx="56" ry="32" fill="#f8fafb" stroke="#587681" stroke-width="2"/>
  <path d="M160 120 q 18 12 36 0 q 18 -12 36 0" fill="none" stroke="#587681" stroke-width="1.6"/>
  <path d="M160 144 q 18 12 36 0 q 18 -12 36 0" fill="none" stroke="#587681" stroke-width="1.6"/>
  <circle cx="284" cy="120" r="5.5" fill="#d9a679"/>
  <path d="M276 126 L248 136" stroke="#1f3439" stroke-width="2" marker-end="url(#sp)"/>

  <!-- Tryptophan-Zufuhr von aussen -->
  <circle cx="654" cy="26" r="6" fill="#d9a679"/>
  <path d="M644 34 L576 64" stroke="#1f3439" stroke-width="2.5" marker-end="url(#sp)"/>

  <!-- Vesikel -->
  <circle cx="322" cy="200" r="30" fill="#f3e0c8" stroke="#d9a679" stroke-width="2.5"/>
  <circle cx="312" cy="193" r="4.5" fill="#d9a679"/><circle cx="330" cy="195" r="4.5" fill="#d9a679"/><circle cx="321" cy="210" r="4.5" fill="#d9a679"/>
  <circle cx="420" cy="140" r="25" fill="#f3e0c8" stroke="#d9a679" stroke-width="2.5"/>
  <circle cx="412" cy="134" r="4.5" fill="#d9a679"/><circle cx="428" cy="137" r="4.5" fill="#d9a679"/><circle cx="419" cy="149" r="4.5" fill="#d9a679"/>
  <circle cx="246" cy="216" r="23" fill="#f3e0c8" stroke="#d9a679" stroke-width="2.5"/>
  <circle cx="239" cy="210" r="4.5" fill="#d9a679"/><circle cx="253" cy="213" r="4.5" fill="#d9a679"/><circle cx="245" cy="224" r="4.5" fill="#d9a679"/>

  <!-- fusionierendes Vesikel -->
  <path d="M472 275 a 30 30 0 1 1 60 0 Z" fill="#f3e0c8" stroke="#d9a679" stroke-width="2.5"/>
  <circle cx="490" cy="256" r="4.5" fill="#d9a679"/><circle cx="514" cy="254" r="4.5" fill="#d9a679"/>

  <!-- Membranen -->
  <line x1="120" y1="275" x2="472" y2="275" stroke="#587681" stroke-width="4"/>
  <line x1="532" y1="275" x2="600" y2="275" stroke="#587681" stroke-width="4"/>
  <line x1="120" y1="360" x2="760" y2="360" stroke="#587681" stroke-width="4"/>

  <!-- SERT -->
  <rect x="200" y="252" width="24" height="46" rx="6" fill="#2f7d8a"/>
  <line x1="212" y1="258" x2="212" y2="292" stroke="#f8fafb" stroke-width="2.5"/>
  <path d="M212 332 L212 304" stroke="#2f7d8a" stroke-width="3" marker-end="url(#spt)"/>

  <!-- 5-HT im Spalt -->
  <circle cx="290" cy="318" r="5.5" fill="#d9a679"/>
  <circle cx="452" cy="322" r="5.5" fill="#d9a679"/>
  <circle cx="486" cy="336" r="5.5" fill="#d9a679"/>
  <circle cx="576" cy="316" r="5.5" fill="#d9a679"/>
  <circle cx="612" cy="334" r="5.5" fill="#d9a679"/>
  <circle cx="712" cy="326" r="5.5" fill="#d9a679"/>

  <!-- postsynaptische Rezeptoren -->
  <path d="M360 343 h60 v34 h-60 z" fill="#f8fafb" stroke="#587681" stroke-width="2.5"/>
  <path d="M380 343 v12 h20 v-12" fill="none" stroke="#587681" stroke-width="2.5"/>
  <path d="M500 343 h60 v34 h-60 z" fill="#f8fafb" stroke="#587681" stroke-width="2.5"/>
  <path d="M520 343 v12 h20 v-12" fill="none" stroke="#587681" stroke-width="2.5"/>
  <path d="M630 343 h60 v34 h-60 z" fill="#f8fafb" stroke="#587681" stroke-width="2.5"/>
  <path d="M650 343 v12 h20 v-12" fill="none" stroke="#587681" stroke-width="2.5"/>

  <line x1="638" y1="334" x2="682" y2="386" stroke="#b03a2e" stroke-width="4"/>
  <line x1="682" y1="334" x2="638" y2="386" stroke="#b03a2e" stroke-width="4"/>

  <path d="M390 414 L390 452" stroke="#1f3439" stroke-width="2.5" marker-end="url(#sp)"/>
  <path d="M530 414 L530 452" stroke="#1f3439" stroke-width="2.5" marker-end="url(#sp)"/>
  <path d="M660 416 L660 448" stroke="#b03a2e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#spr)"/>

  <g id="beschriftung" font-family="Segoe UI, Helvetica, Arial, sans-serif" fill="#1f3439">
    <text x="24" y="34" font-size="17" font-weight="600">Serotonerge Synapse: wo Arzneistoffe eingreifen</text>

    <text x="670" y="31" font-size="12.5" fill="#587681">Tryptophan</text>
    <text x="264" y="90" font-size="14" font-weight="600">präsynaptisches Endknöpfchen</text>
    <text x="196" y="137" font-size="13" text-anchor="middle" font-weight="600">MAO-A</text>
    <text x="420" y="104" font-size="12.5" text-anchor="middle" fill="#587681">Vesikel</text>
    <text x="212" y="246" font-size="13" text-anchor="middle" font-weight="600" fill="#2f7d8a">SERT</text>
    <text x="618" y="266" font-size="12.5" fill="#587681">synaptischer Spalt</text>
    <path d="M700 272 L700 300" stroke="#587681" stroke-width="1.4"/>
    <text x="390" y="400" font-size="12" text-anchor="middle" fill="#587681">5-HT1A</text>
    <text x="530" y="400" font-size="12" text-anchor="middle" fill="#587681">5-HT2A</text>
    <text x="660" y="404" font-size="12" text-anchor="middle" fill="#587681">5-HT3</text>
    <text x="330" y="482" font-size="14" font-weight="600">postsynaptisches Neuron</text>
    <text x="330" y="504" font-size="13" fill="#587681">Signalweiterleitung</text>

    <g font-size="14" font-weight="700" fill="#f8fafb">
      <circle cx="548" cy="96" r="15" fill="#1f3439"/><text x="548" y="101" text-anchor="middle">1</text>
      <circle cx="556" cy="240" r="15" fill="#1f3439"/><text x="556" y="245" text-anchor="middle">2</text>
      <circle cx="146" cy="188" r="15" fill="#1f3439"/><text x="146" y="193" text-anchor="middle">3</text>
      <circle cx="212" cy="350" r="15" fill="#2f7d8a"/><text x="212" y="355" text-anchor="middle">4</text>
      <circle cx="336" cy="348" r="15" fill="#1f3439"/><text x="336" y="353" text-anchor="middle">5</text>
      <circle cx="722" cy="356" r="15" fill="#b03a2e"/><text x="722" y="361" text-anchor="middle">6</text>
    </g>

    <text x="24" y="604" font-size="13" fill="#587681">Die Punkte 1 bis 5 erhöhen die serotonerge Aktivität und addieren sich. Genau diese Addition ist das Risiko.</text>

    <g font-size="13.5">
      <circle cx="36" cy="638" r="13" fill="#1f3439"/><text x="36" y="643" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafb">1</text>
      <text x="58" y="643">Vorstufe zuführen</text>
      <circle cx="36" cy="674" r="13" fill="#1f3439"/><text x="36" y="679" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafb">2</text>
      <text x="58" y="679">Freisetzung steigern</text>
      <circle cx="36" cy="710" r="13" fill="#1f3439"/><text x="36" y="715" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafb">3</text>
      <text x="58" y="715">Abbau hemmen (MAO)</text>

      <circle cx="452" cy="638" r="13" fill="#2f7d8a"/><text x="452" y="643" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafb">4</text>
      <text x="474" y="643">Wiederaufnahme hemmen (SERT)</text>
      <circle cx="452" cy="674" r="13" fill="#1f3439"/><text x="452" y="679" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafb">5</text>
      <text x="474" y="679">Rezeptor direkt aktivieren</text>
      <circle cx="452" cy="710" r="13" fill="#b03a2e"/><text x="452" y="715" text-anchor="middle" font-size="13" font-weight="700" fill="#f8fafb">6</text>
      <text x="474" y="715">Rezeptor blockieren – senkt die Wirkung</text>
    </g>
  </g>
</svg>
