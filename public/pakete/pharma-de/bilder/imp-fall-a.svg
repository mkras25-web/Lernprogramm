<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330">
  <rect width="460" height="330" fill="#eef2f3"/>
  <rect x="20" y="20" width="420" height="290" rx="12" fill="#f8fafb" stroke="#d7e0e2" stroke-width="2"/>
  <rect x="20" y="20" width="420" height="46" rx="12" fill="#2f7d8a"/>
  <rect x="20" y="52" width="420" height="14" fill="#2f7d8a"/>
    <text x="40" y="50" font-size="16" font-weight="600" fill="#f8fafb" font-family="Segoe UI, Helvetica, Arial, sans-serif">Impfwunsch A</text>
  <rect x="40" y="96" width="24" height="34" rx="5" fill="#f3e0c8" stroke="#d9a679" stroke-width="2"/>
  <line x1="40" y1="113" x2="64" y2="113" stroke="#d9a679" stroke-width="2"/>
    <text x="80" y="119" font-size="17" font-weight="600" fill="#1f3439" font-family="Segoe UI, Helvetica, Arial, sans-serif">Grippeschutzimpfung</text>
  <line x1="40" y1="160" x2="420" y2="160" stroke="#d7e0e2" stroke-width="2"/>
    <text x="40" y="192" font-size="13.5" fill="#587681" font-family="Segoe UI, Helvetica, Arial, sans-serif">Jugendliche, 15 Jahre alt.</text>
    <text x="40" y="218" font-size="13.5" fill="#587681" font-family="Segoe UI, Helvetica, Arial, sans-serif">Beide Sorgeberechtigten haben</text>
    <text x="40" y="244" font-size="13.5" fill="#587681" font-family="Segoe UI, Helvetica, Arial, sans-serif">schriftlich zugestimmt, die Mutter</text>
    <text x="40" y="270" font-size="13.5" fill="#587681" font-family="Segoe UI, Helvetica, Arial, sans-serif">ist anwesend und weist sich aus.</text>
    <text x="40" y="296" font-size="13.5" fill="#587681" font-family="Segoe UI, Helvetica, Arial, sans-serif">Keine Kontraindikationen.</text>
</svg>
